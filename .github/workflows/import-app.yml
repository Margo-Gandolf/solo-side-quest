name: Import standalone app

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-app.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest self-contained app
        run: curl -fsSL 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JDJFGyY4yNN3C1qJ5qLbS94dFR/5e74e1f8-d283-437d-8b43-a364dffe40d6.html' -o index.html
      - name: Commit app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Update i人小副本 app'
          git push
