<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f0d8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" id="app-icon" type="image/png">
  <link rel="apple-touch-icon" id="app-touch-icon">
  <title>太阳谷 · Serendipity</title>
  <style>
    :root {
      --paper: #f8e2df;
      --paper-deep: #e8c2bd;
      --surface: #fff5ef;
      --surface-soft: #fae7de;
      --ink: #432a25;
      --ink-soft: #77554d;
      --ink-faint: #a57d72;
      --line: #dfb9b0;
      --forest: #b34f3d;
      --forest-deep: #87372d;
      --sage: #bf765f;
      --sage-soft: #f2cfbf;
      --peach: #e47d5b;
      --peach-soft: #f9d3c1;
      --lilac: #a56360;
      --lilac-soft: #efd3ce;
      --danger: #982f27;
      --shadow: 0 16px 45px rgba(111, 52, 43, .12);
      --shadow-soft: 0 8px 24px rgba(111, 52, 43, .08);
      --radius-xl: 28px;
      --radius-lg: 21px;
      --radius-md: 15px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --sans: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      --serif: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--paper); }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 9% 2%, rgba(228, 125, 91, .24), transparent 25rem),
        radial-gradient(circle at 92% 18%, rgba(183, 109, 114, .2), transparent 28rem),
        var(--paper);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.72;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, input, select, textarea { font: inherit; color: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 3px solid rgba(47, 81, 68, .26);
      outline-offset: 3px;
    }
    button:disabled { cursor: not-allowed; opacity: .52; }
    img { display: block; max-width: 100%; }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { font-family: var(--serif); font-weight: 800; letter-spacing: -.015em; }
    svg { display: block; }
    .bi-en {
      display: block;
      margin-top: 2px;
      color: var(--ink-faint);
      font-family: var(--sans);
      font-size: max(9px, .68em);
      font-weight: 500;
      letter-spacing: 0;
      line-height: 1.35;
      text-transform: none;
    }
    .mode-chip .bi-en,
    .record-phrase .bi-en {
      display: inline;
      margin: 0 0 0 3px;
      font-size: 8px;
    }
    button .bi-en { margin-top: 1px; font-size: 8px; line-height: 1.15; }
    .nav-btn .bi-en { font-size: 8px; line-height: 1.1; opacity: .9; }
    html[data-language="zh"] .bi-en,
    html[data-language="zh"] .task-en-title,
    html[data-language="zh"] .task-en-desc,
    html[data-language="zh"] .record-en,
    html[data-language="zh"] .task-en-mini {
      display: none !important;
    }
    html[data-language="en"] .bi-zh,
    html[data-language="en"] .task-zh-title,
    html[data-language="en"] .task-zh-desc {
      display: none !important;
    }
    html[data-language="en"] .bi-en {
      margin-top: 0;
      color: var(--ink-soft);
      font-size: .92em;
      font-weight: 600;
      line-height: 1.58;
    }
    html[data-language="en"] h1 .bi-en,
    html[data-language="en"] h2 .bi-en,
    html[data-language="en"] h3 .bi-en {
      color: inherit;
      font-size: .82em;
      font-weight: 800;
      line-height: 1.4;
    }
    html[data-language="en"] p .bi-en { color: var(--ink-soft); font-size: 1em; }
    html[data-language="en"] button .bi-en {
      margin: 0;
      color: inherit;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.25;
    }
    html[data-language="en"] .nav-btn .bi-en {
      font-size: 10px;
      font-weight: 700;
      line-height: 1.2;
    }
    html[data-language="en"] .mode-chip .bi-en,
    html[data-language="en"] .record-phrase .bi-en {
      font-size: 10px;
      font-weight: 700;
    }
    html[data-language="en"] .today-home-head h1 span { white-space: normal; }
    html[data-language="en"] .simple-task h2 .task-en-title {
      margin-bottom: 9px;
      color: inherit;
      font-size: clamp(26px, 6.4vw, 35px);
      font-weight: 800;
      line-height: 1.36;
    }
    html[data-language="en"] .micro-task h3 .task-en-title {
      margin-bottom: 8px;
      font-size: 15px;
      line-height: 1.5;
    }
    html[data-language="en"] .task-en-desc {
      margin-top: 0;
      color: var(--ink-soft);
      font-size: 13px;
      line-height: 1.75;
    }
    html[data-language="en"] .is-main .task-en-title { color: #fffaf0; }
    html[data-language="en"] .is-main .task-en-desc {
      color: rgba(255,250,240,.9);
      font-size: 15px;
      line-height: 1.8;
    }
    html[data-language="en"] .is-main .simple-task-head .bi-en,
    html[data-language="en"] .is-main .simple-task-meta .bi-en {
      color: rgba(255,250,240,.82);
      font-size: 12px;
      font-weight: 650;
    }
    html[data-language="en"] .task-cover-kicker .bi-en {
      color: inherit;
      font-size: 13px;
      font-weight: 750;
    }
    html[data-language="en"] .task-cover-note .bi-en {
      font-size: 12px;
    }
    html[data-language="en"] .record-en { color: var(--ink-soft); font-size: 12px; }
    html[data-language="en"] .task-en-mini { color: var(--ink-soft); font-size: 11px; line-height: 1.5; }
    html[data-language="en"] .preset-en { color: var(--ink-soft); font-size: 13px; line-height: 1.6; }

    .shell {
      position: relative;
      width: min(100%, 760px);
      min-height: 100vh;
      margin: 0 auto;
      overflow: clip;
    }

    .page {
      padding: 22px clamp(18px, 4vw, 34px) calc(126px + var(--safe-bottom));
      animation: settle .28s ease both;
    }

    @keyframes settle {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: clamp(24px, 5vw, 40px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      overflow: hidden;
      padding: 0;
      border-radius: 50%;
      color: #fff9ec;
      background: var(--forest);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.1);
    }
    .brand-avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-copy { min-width: 0; }
    .brand-name {
      display: block;
      font-family: var(--serif);
      font-weight: 800;
      font-size: 18px;
      line-height: 1.3;
      letter-spacing: .02em;
    }
    .brand-note {
      display: block;
      margin-top: 3px;
      color: var(--ink-faint);
      font-size: 11px;
      line-height: 1.2;
      letter-spacing: .08em;
    }

    .xp-mark {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
      padding: 8px 12px;
      border: 1px solid rgba(47, 81, 68, .12);
      border-radius: 999px;
      color: var(--forest);
      background: rgba(255, 253, 248, .64);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .03em;
    }

    .dayline {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .04em;
    }
    .dayline::before {
      content: "";
      width: 18px;
      height: 1px;
      background: var(--sage);
    }

    .hero-copy {
      margin-bottom: 24px;
    }
    .hero-copy h1 {
      max-width: 620px;
      margin-bottom: 10px;
      font-size: clamp(32px, 8vw, 50px);
      line-height: 1.16;
    }
    .hero-copy p {
      max-width: 520px;
      margin-bottom: 0;
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.75;
    }

    .today-home-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }
    .today-home-head h1 {
      margin-bottom: 0;
      font-size: clamp(26px, 7vw, 39px);
      line-height: 1.38;
    }
    .today-home-head h1 span {
      display: block;
      white-space: nowrap;
    }
    .today-date {
      margin-bottom: 7px;
      color: var(--ink-faint);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .04em;
    }
    .mode-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      min-height: 33px;
      padding: 6px 10px;
      border: 1px solid rgba(91,55,39,.12);
      border-radius: 999px;
      color: var(--forest);
      background: rgba(255,253,248,.65);
      font-size: 11px;
      font-weight: 650;
      white-space: nowrap;
    }
    .simple-task {
      position: relative;
      overflow: hidden;
      padding: 0;
      border: 1px solid rgba(91,55,39,.1);
      border-radius: var(--radius-xl);
      background: rgba(255,253,248,.92);
      box-shadow: var(--shadow-soft);
    }
    .task-hidden { min-height: 0; }
    .task-cover {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      width: 100%;
      min-height: 154px;
      padding: clamp(22px, 5vw, 30px);
      border: 0;
      color: inherit;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .is-main > .task-cover { min-height: 186px; }
    .task-cover:hover { background: rgba(255,255,255,.055); }
    .task-cover:active { background: rgba(0,0,0,.035); }
    .task-cover:focus-visible {
      outline: 3px solid rgba(193,71,38,.3);
      outline-offset: -5px;
    }
    .task-cover-copy {
      display: flex;
      flex: 1;
      min-width: 0;
      flex-direction: column;
    }
    .task-cover-kicker {
      margin-bottom: 8px;
      color: var(--ink-faint);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .12em;
    }
    .is-main .task-cover-kicker {
      color: rgba(255,248,234,.65);
      font-size: 12px;
      letter-spacing: .1em;
    }
    .task-cover-title {
      font-family: var(--serif);
      font-size: clamp(24px, 6vw, 33px);
      font-weight: 800;
      letter-spacing: -.02em;
      line-height: 1.38;
    }
    .is-main .task-cover-title { color: #fffaf0; }
    .task-cover-note {
      margin-top: 6px;
      color: var(--ink-faint);
      font-size: 11px;
    }
    .is-main .task-cover-note { color: rgba(255,248,234,.54); }
    .is-main .task-type-label {
      font-size: 12px;
      letter-spacing: .08em;
    }
    .task-cover-mark {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      border: 1px solid rgba(91,55,39,.16);
      border-radius: 50%;
      color: var(--forest);
      background: rgba(255,243,216,.7);
    }
    .is-main .task-cover-mark {
      color: #fff1cf;
      border-color: rgba(255,255,255,.16);
      background: rgba(255,255,255,.08);
    }
    .task-hidden.is-rolling .task-cover {
      animation: randomCard .3s steps(2, end) infinite;
    }
    .task-hidden.is-rolling .task-cover-mark {
      animation: randomSpin .7s linear infinite;
      color: var(--forest-deep);
      background: var(--sage-soft);
    }
    .roll-dots {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      margin-left: 7px;
      vertical-align: middle;
    }
    .roll-dots i {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
      animation: rollDot .7s ease-in-out infinite;
    }
    .roll-dots i:nth-child(2) { animation-delay: .12s; }
    .roll-dots i:nth-child(3) { animation-delay: .24s; }
    @keyframes randomCard {
      0% { transform: translateX(-2px) rotate(-.18deg); }
      50% { transform: translateX(2px) rotate(.18deg); }
      100% { transform: translateX(-2px) rotate(-.18deg); }
    }
    @keyframes randomSpin { to { transform: rotate(360deg); } }
    @keyframes rollDot {
      0%, 70%, 100% { opacity: .25; transform: translateY(0); }
      35% { opacity: 1; transform: translateY(-3px); }
    }
    .task-body.revealed-content {
      padding-top: clamp(22px, 5vw, 30px);
    }
    .task-body {
      padding: 0 clamp(20px, 4.5vw, 27px) clamp(20px, 4.5vw, 27px);
      animation: taskBodyIn .18s ease both;
    }
    @keyframes taskBodyIn {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .simple-task.is-main {
      color: #fffdf8;
      border-color: transparent;
      background: var(--forest-deep);
      box-shadow: 0 20px 46px rgba(89,55,46,.18);
    }
    .simple-task.is-done { background: var(--sage-soft); }
    .simple-task.is-main.is-done { background: #cf7662; }
    .simple-task-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 15px;
      color: var(--ink-faint);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .is-main .simple-task-head { color: rgba(255,255,255,.62); }
    .simple-task-head span:last-child { letter-spacing: 0; text-transform: none; }
    .simple-task h2 {
      margin-bottom: 7px;
      font-size: clamp(27px, 6.5vw, 38px);
      line-height: 1.35;
    }
    .task-en-title {
      margin: -1px 0 10px;
      color: var(--ink-faint);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .015em;
      line-height: 1.45;
    }
    .is-main .task-en-title { color: rgba(255,248,234,.58); }
    .task-body > p {
      margin-bottom: 17px;
      color: var(--ink-soft);
      font-size: 13px;
      line-height: 1.8;
    }
    .simple-task.is-main .task-body > p { color: rgba(255,255,255,.7); }
    .task-en-desc {
      display: block;
      margin-top: 5px;
      color: var(--ink-faint);
      font-size: 10px;
      line-height: 1.7;
    }
    .is-main .task-en-desc { color: rgba(255,248,234,.5); }
    .simple-task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 19px;
      color: var(--ink-faint);
      font-size: 10px;
    }
    .simple-task-meta span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 8px;
      border-radius: 8px;
      background: var(--surface-soft);
    }
    .is-main .simple-task-meta { color: rgba(255,255,255,.72); }
    .is-main .simple-task-meta span { background: rgba(255,255,255,.075); }
    .simple-task-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .simple-task-actions .btn { min-height: 43px; }
    .simple-task-actions .btn-primary {
      color: var(--forest-deep);
      background: #fff9ea;
    }
    .simple-task-actions .tiny-action {
      min-height: 40px;
      padding: 8px 11px;
      border: 0;
      border-radius: 11px;
      color: rgba(255,255,255,.68);
      background: rgba(255,255,255,.07);
      font-size: 11px;
      cursor: pointer;
    }
    .simple-task-actions .tiny-action:disabled { opacity: .45; }
    .micro-task-head {
      margin: 22px 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .micro-task-head h2 {
      margin-bottom: 0;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .micro-task-head span { color: var(--ink-faint); font-size: 10px; }
    .micro-task-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .micro-task {
      display: block;
      min-height: 0;
      border-color: #d99b8a;
      background: #f7d9d2;
      box-shadow: none;
    }
    .micro-task.is-done {
      border-color: #c47a68;
      background: #f1c6bc;
    }
    .micro-task h3 {
      margin-bottom: 5px;
      font-size: 20px;
      line-height: 1.42;
    }
    .micro-task .task-en-title { margin: -1px 0 8px; font-size: 10px; }
    .micro-task .task-body { padding: 0 18px 18px; }
    .micro-task .task-cover { min-height: 138px; padding: 19px 18px; }
    .micro-task .task-cover-title { font-size: 22px; }
    .micro-task .task-cover-mark { width: 43px; height: 43px; flex-basis: 43px; }
    .micro-task .task-body.revealed-content { padding-top: 19px; }
    .micro-task .task-body > p {
      margin-bottom: 13px;
      font-size: 12px;
    }
    .micro-task .simple-task-meta { margin-bottom: 14px; }
    .micro-task .simple-task-actions { margin-top: auto; }
    .micro-task .simple-task-actions .btn {
      width: 100%;
      color: var(--forest);
      border-color: rgba(91,55,39,.12);
      background: #fff2e8;
    }
    .extra-draw {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 15px 16px;
      margin-top: 14px;
      border: 1px dashed var(--line);
      border-radius: 16px;
      background: rgba(255,245,239,.57);
    }
    .extra-draw div {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .extra-draw strong { font-size: 13px; }
    .extra-draw span { color: var(--ink-faint); font-size: 10px; }
    .extra-draw .btn { flex: 0 0 auto; }
    @media (max-width: 430px) {
      .extra-draw {
        align-items: stretch;
        flex-direction: column;
      }
      .extra-draw .btn { width: 100%; }
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--ink-faint);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .segment {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 4px;
      margin-bottom: 18px;
      border: 1px solid rgba(91,55,39,.1);
      border-radius: 14px;
      background: rgba(255,253,248,.55);
    }
    .segment button {
      min-height: 38px;
      padding: 7px 8px;
      border: 0;
      border-radius: 10px;
      color: var(--ink-soft);
      background: transparent;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
    }
    .segment button.is-active {
      color: #fff;
      background: var(--forest);
      box-shadow: 0 5px 14px rgba(83,45,35,.16);
    }

    .quest-card {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      min-height: 300px;
      padding: clamp(24px, 6vw, 38px);
      border-radius: var(--radius-xl);
      color: #fffdf8;
      background: var(--forest-deep);
      box-shadow: 0 22px 50px rgba(35, 58, 49, .2);
    }
    .quest-card::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 340px;
      height: 340px;
      right: -170px;
      top: -150px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 50%;
      box-shadow: 0 0 0 52px rgba(255,255,255,.025), 0 0 0 105px rgba(255,255,255,.018);
    }
    .quest-card::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 120px;
      height: 1px;
      right: 36px;
      bottom: 34px;
      background: rgba(255,255,255,.16);
      box-shadow: 24px -18px 0 rgba(255,255,255,.08);
    }
    .quest-card.is-done {
      background: #cf7662;
    }
    .quest-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 32px;
      color: rgba(255,255,255,.69);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .07em;
    }
    .quest-index {
      display: inline-flex;
      align-items: center;

    .data-actions {

    }
    .settings-summary-note {

    .privacy-note {

    .wizard-wrap {

    }
    .wizard-copy p { max-width: 520px; margin-bottom: 0; color: var(--ink-soft); font-size: 14px; }
    .preset-list { display: grid; gap: 9px; margin-bottom: 20px; }
    .preset {
      position: relative;

    }
    .preset:has(input:checked) {

    .preset input {
      position: absolute;
      width: 1px;

    }
    .preset span {
      display: block;

    }

    html[data-language="en"] .preset-zh { display: none; }
    html[data-language="en"] .preset-en { display: block !important; }
    .preset::after {
      content: "";
      position: absolute;
      right: 18px;
      top: 50%;

      height: 19px;
      border: 1px solid var(--line);
      border-radius: 50%;

    }
    .preset:has(input:checked)::after {

    }
    .wizard-actions {
      display: flex;
      gap: 9px;

    .wizard-actions .btn-primary { color: #fff; background: var(--forest); }

    .wizard-actions .grow { flex: 1; }
    .wizard-actions-simple { margin-top: 22px; }

    .overlay {

    .sheet-head {

      justify-content: space-between;
      gap: 16px;
      margin-bottom: 19px;
    }

      margin: -1px 0 6px;
      color: var(--ink-faint);
      font-size: 11px;
      line-height: 1.45;
    }
    .sheet-head p { margin-bottom: 0; color: var(--ink-soft); font-size: 12px; }
    .icon-btn {
      display: grid;
      place-items: center;
      width: 39px;
      height: 39px;
      flex: 0 0 39px;

      color: var(--ink-soft);

    }
    .chip-row { display: flex; flex-wrap: wrap; gap: 7px; }

      gap: 8px;
    }

      min-height: 50px;
      padding: 11px;
      border: 1px solid var(--line);

    .toast-wrap {

      bottom: calc(91px + var(--safe-bottom));
      width: min(calc(100% - 32px), 470px);
      transform: translateX(-50%);

    }

    .empty {
      padding: 38px 20px;

      height: 1px;

    @media (min-width: 680px) {

    }

    /* Hand-cut paper skin */
    :root {
      --paper: #f3f0d8;
      --paper-deep: #ddd6b8;
      --surface: #fffdf2;
      --surface-soft: #f5e5c5;
      --ink: #46352b;
      --ink-soft: #765e4e;
      --ink-faint: #9c8472;
      --line: #ba9d7f;
      --forest: #a7573f;
      --forest-deep: #7f3d30;
      --sage: #6b7b46;
      --sage-soft: #e5e1b8;
      --peach: #d98f67;
      --peach-soft: #f4dacb;
      --mustard: #d6a04c;
      --tape: rgba(224, 203, 151, .78);
      --paper-shadow: rgba(83, 55, 39, .16);
      --radius-xl: 21px 15px 24px 14px / 15px 23px 14px 21px;
      --radius-lg: 17px 12px 19px 11px / 12px 18px 11px 17px;
      --radius-md: 12px 9px 14px 8px / 9px 13px 8px 12px;
    }

    html { background: var(--paper); }
    body {
      background-color: var(--paper);
      background-image:
        radial-gradient(circle at 18% 24%, rgba(91, 62, 43, .055) 0 1px, transparent 1.4px),
        radial-gradient(circle at 77% 68%, rgba(255, 250, 226, .6) 0 1px, transparent 1.5px),
        repeating-linear-gradient(7deg, rgba(102, 74, 48, .022) 0 1px, transparent 1px 7px),
        repeating-linear-gradient(94deg, rgba(255, 255, 255, .13) 0 1px, transparent 1px 11px);
      background-size: 17px 19px, 23px 21px, auto, auto;
    }

    ::selection { color: var(--ink); background: #e9c45f; }

    .topbar {
      padding-bottom: 12px;
      border-bottom: 1.5px dashed rgba(104, 75, 54, .25);
    }
    .brand-mark {
      width: 42px;
      height: 42px;
      flex-basis: 42px;
      border: 2px solid #5a342b;
      border-radius: 45% 55% 48% 52% / 51% 45% 55% 49%;
      background: #f7e8b7;
      box-shadow: 2px 3px 0 rgba(87, 53, 37, .2);
      transform: rotate(-2deg);
    }
    .brand-name { letter-spacing: .04em; }
    .xp-mark,
    .mode-chip {
      border: 1.5px solid rgba(93, 61, 41, .3);
      border-radius: 9px 7px 10px 6px / 7px 10px 6px 9px;
      background: rgba(255, 247, 220, .82);
      box-shadow: 2px 2px 0 rgba(87, 53, 37, .13);
      transform: rotate(1deg);
    }
    .today-home-head h1 {
      color: #4b3126;
      text-shadow: 1px 1px 0 rgba(255, 250, 230, .7);
    }

    .simple-task,
    .card,
    .anchor-card,
    .settings-group,
    .settings-advanced,

<style>
/* ===== 开场动画 · 手账纸片 ===== */
#pi {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: grid;
  place-items: center;
  background:
    radial-gradient(circle at 9% 2%, rgba(228, 125, 91, .24), transparent 22rem),
    radial-gradient(circle at 92% 18%, rgba(183, 109, 114, .2), transparent 24rem),
    var(--paper, #f8e2df);
  font-family: var(--sans, "Microsoft YaHei UI", "PingFang SC", sans-serif);
  color: var(--ink, #432a25);
}
#pi.pi-out { animation: piOut .58s ease-in forwards; }
@keyframes piOut { to { opacity: 0; transform: scale(1.02); } }

.pi-stage { position: relative; width: min(86vw, 340px); }

.pi-card {
  position: relative;
  background: var(--surface, #fff5ef);
  border-radius: 26px;
  box-shadow: var(--shadow, 0 16px 45px rgba(111, 52, 43, .12));
  padding: 22px 20px 26px;
  transform: rotate(-1.6deg);
  opacity: 0;
  animation: piCardIn .62s cubic-bezier(.19, .9, .28, 1) .14s forwards;
}
@keyframes piCardIn {
  from { opacity: 0; transform: translateY(30px) rotate(-4deg) scale(.97); }
  to   { opacity: 1; transform: translateY(0) rotate(-1.6deg) scale(1); }
}
.pi-card::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 26px;
  box-shadow: inset 0 0 0 1px rgba(223, 185, 176, .45),
              inset 0 0 42px rgba(232, 194, 189, .3);
  pointer-events: none;
}

.pi-art { position: relative; width: 100%; aspect-ratio: 300 / 260; }
.pi-sky { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.pi-sky path {
  fill: none;
  stroke: currentColor;
  stroke-width: 2.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: var(--len);
  stroke-dashoffset: var(--len);
  animation: piDraw .6s ease-out forwards;
  animation-delay: var(--d);
}
@keyframes piDraw { to { stroke-dashoffset: 0; } }
.pi-sky .pi-moon { stroke-width: 1.7; }
.pi-sky .pi-moonfill {
  fill: #f8dfa0;
  stroke: none;
  opacity: 0;
  animation: piFade .8s ease-out forwards;
  animation-delay: var(--d);
}
.pi-sky .pi-dot {
  fill: currentColor;
  stroke: none;
  stroke-dasharray: none;
  stroke-dashoffset: 0;
  opacity: 0;
  animation: piFade .28s ease-out forwards;
  animation-delay: var(--d);
}
@keyframes piFade { to { opacity: 1; } }

/* 贴纸掉下来，弹一下 */
.pi-girl {
  position: absolute;
  left: 42%;
  bottom: -2%;
  width: 40%;
  transform-origin: 50% 88%;
  opacity: 0;
  filter: drop-shadow(0 10px 16px rgba(111, 52, 43, .18));
  animation: piStickIn .58s cubic-bezier(.17, 1.5, .42, 1) 1.46s forwards;
}
@keyframes piStickIn {
  from { opacity: 0; transform: translate(-50%, -22px) rotate(8deg) scale(.88); }
  62%  { opacity: 1; }
  to   { opacity: 1; transform: translate(-50%, 0) rotate(-2deg) scale(1); }
}

.pi-line {
  margin: 10px 0 0;
  font-size: clamp(14px, 4.7vw, 19px);
  font-weight: 700;
  line-height: 1.85;
  text-align: center;
  white-space: normal;
  color: var(--ink, #432a25);
}
.pi-line .pi-row { display: block; }
.pi-line span {
  display: inline-block;
  opacity: 0;
  transform: translateY(6px) rotate(var(--r));
  animation: piChIn .42s cubic-bezier(.2, .9, .3, 1) forwards;
  animation-delay: var(--d);
  clip-path: inset(-20% 100% -20% -4%);
}
@keyframes piChIn {
  0%   { opacity: 0; transform: translateY(6px) rotate(var(--r)); clip-path: inset(-20% 100% -20% -4%); }
  60%  { opacity: 1; }
  100% { opacity: 1; transform: translateY(0) rotate(var(--r)); clip-path: inset(-20% -8% -20% -4%); }
}

.pi-underline { display: block; width: 64%; margin: 0 auto; color: var(--peach, #e47d5b); overflow: visible; }
.pi-underline path {
  fill: none;
  stroke: currentColor;
  stroke-width: 2.8;
  stroke-linecap: round;
  stroke-dasharray: var(--len);
  stroke-dashoffset: var(--len);
  animation: piDraw .7s ease-out forwards;
  animation-delay: var(--d);
}

/* 胶带 */
.pi-tape {
  position: absolute;
  width: 72px;
  height: 24px;
  background: repeating-linear-gradient(45deg, rgba(228, 125, 91, .36) 0 6px, rgba(255, 245, 239, .55) 6px 12px);
  border-radius: 3px;
  box-shadow: 0 2px 6px rgba(111, 52, 43, .08);
  opacity: 0;
}
.pi-tape.t1 { left: -20px; top: 14px; transform: rotate(-34deg); animation: piTape1 .34s ease-out .62s forwards; }
.pi-tape.t2 { right: -22px; bottom: 20px; transform: rotate(-38deg); animation: piTape2 .34s ease-out .74s forwards; }
@keyframes piTape1 {
  from { opacity: 0; transform: rotate(-34deg) scale(.6); }
  to   { opacity: .95; transform: rotate(-34deg) scale(1); }
}
@keyframes piTape2 {
  from { opacity: 0; transform: rotate(-38deg) scale(.6); }
  to   { opacity: .95; transform: rotate(-38deg) scale(1); }
}

.pi-skip {
  position: absolute;
  right: 16px;
  bottom: calc(22px + var(--safe-bottom, 0px));
  font-size: 12px;
  color: var(--ink-faint, #a57d72);
  letter-spacing: .08em;
  opacity: 0;
  animation: piFade .4s ease-out 1.4s forwards;
  cursor: pointer;
  user-select: none;
}

@media (prefers-reduced-motion: reduce) {
  #pi, #pi * { animation-duration: .01ms !important; animation-delay: 0ms !important; }
}

      A17: ['反着来', 'Run it backwards', '把今天做过的一个决定反过来写一遍。', 'Rewrite one decision from today as if you had chosen the opposite.'],
      V8: ['只看封面', 'Cover only', '在书架或书店扫一遍只挑一本看封面和书名。', 'Scan a shelf or a shop and look at just one cover and title.'],
      V9: ['一句摘抄', 'One line copied', '从正在读的东西里抄一句不解释为什么。', 'Copy one line from what you are reading. No explaining why.'],
      V10: ['窗边十页', 'Ten pages by the window', '把书带到窗边读完这一小节。', 'Take the book to the window and finish this section.'],
      V11: ['十分钟只读', 'Ten minutes of just reading', '定十分钟只读不碰手机。', 'Set ten minutes. Read only. No phone.'],
      V12: ['问作者一句', 'One question for the author', '读完写下一个想问作者的问题。', 'After reading, write one question you would ask the author.'],
      V13: ['换书名', 'Rename the book', '给这本书起一个你自己的名字写在便签上。', 'Give the book your own title and write it on a sticky note.'],
      X17: ['三行流水账', 'Three lines', '只写三行早中晚各一句。', 'Three lines only: morning, noon, night.'],
      X18: ['今天的一个证据', 'One piece of evidence', '拍下或写下今天确实发生过的一件小事。', 'Photo or note one small thing that really happened today.'],
      X19: ['写给明天的便签', 'A note to tomorrow', '一句话贴在明天一定会看到的地方。', 'One line, stuck where tomorrow-you will see it.'],
      X20: ['一张小票的故事', 'The story of a receipt', '挑今天的一张收据写下它背后的一件事。', 'Pick one receipt from today and write the story behind it.'],
      X21: ['今天的三个坐标', 'Three coordinates', '记下今天待过的三个位置各写一句。', 'Note three places you were today, one line each.'],
      X22: ['卡住的地方', 'Where it stuck', '记下今天让你卡住的一件小事先不解决。', 'Write down one small thing that snagged today. Do not fix it yet.'],
      X23: ['没人看见的小胜利', 'An unseen win', '写一件今天做到了但没人注意到的事。', 'Write one thing you did today that nobody noticed.'],
      X24: ['借来的眼睛', 'Borrowed eyes', '想象一个陌生人第一次进你的房间写下他先注意到的三样。', 'Imagine a stranger entering your room for the first time. Note the first three things they would notice.'],
      W8: ['一笔画完', 'One-line drawing', '不看纸一口气画一条线画完再看。', 'Draw one continuous line without looking. Look afterwards.'],
      W9: ['只涂一种色', 'One colour only', '挑一个颜色涂满一小块。', 'Pick one colour and fill a small area.'],
      W10: ['三个图形画今天', 'Today in three shapes', '只用圆方三角画一遍今天。', 'Draw today using only circles, squares and triangles.'],
      W11: ['影子写生', 'Shadow study', '用窗光或台灯把一件东西的影子描下来。', 'Trace the shadow of an object using window light or a lamp.'],
      W12: ['旧物重拍', 'Reshoot an old thing', '找一件用旧的东西换个角度重拍一张。', 'Find something worn and photograph it from a new angle.'],
      U8: ['一首歌的画面', 'First image from a song', '听一首歌画出它给你的第一个画面。', 'Play a song and draw the first image it gives you.'],
      K21: ['读完一本薄的', 'Finish a thin book', '挑一本薄的一次读完。', 'Pick a thin book and read it in one sitting.'],
      K22: ['做一页手账', 'One journal page', '用一小时做一页写贴画都行。', 'Spend an hour on one page: write, paste, draw.'],
      K23: ['一个主题的半天', 'Half a day, one theme', '选一个主题比如门出门拍十张。', 'Pick a theme, doors say, and shoot ten photos outside.']
    };

    function parseTask(line) {
      const [id, name, desc, minuteText, completion, category, scene, social, body] = line.split('|');
      const bounds = minuteText.split('-').map(Number);
      return {
        id, name, desc, minutes: minuteText, completion, category, scene, social, body,
        minMinutes: Math.min(...bounds),
        maxMinutes: Math.max(...bounds),
        xp: id.startsWith('I') ? 15 : id.startsWith('M') ? 5 : id.startsWith('K') ? 24 : id.startsWith('R') ? 12 : 10,
        isAnchor: id.startsWith('M')
      };
    }

    const TASKS = TASK_SOURCE.trim().split(/\r?\n/).filter(Boolean).map(parseTask).map(t => {
      const copy = TASK_COPY[t.id];
      return copy ? {
        ...t,
        name: copy[0],
        enName: copy[1],
        desc: copy[2],
        enDesc: copy[3]
      } : { ...t, enName: t.name, enDesc: t.desc };
    });
    const MAIN_TASKS = TASKS.filter(t => !t.isAnchor);
    const ANCHOR_TASKS = TASKS.filter(t => t.isAnchor);
    const TASK_BY_ID = Object.fromEntries(TASKS.map(t => [t.id, t]));

    const dateKey = (date = new Date()) => {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };
    const parseDateKey = key => {
      const [y, m, d] = key.split('-').map(Number);
      return new Date(y, m - 1, d, 12);
    };
    const addDays = (key, amount) => {
      const d = parseDateKey(key);
      d.setDate(d.getDate() + amount);
      return dateKey(d);
    };
    const dayDistance = (from, to) => Math.round((parseDateKey(to) - parseDateKey(from)) / 86400000);
    const getWeekKey = (date = new Date()) => {
      const d = new Date(date);
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
      const firstThursday = new Date(d.getFullYear(), 0, 4);
      return `${d.getFullYear()}-W${String(1 + Math.round(((d - firstThursday) / 86400000 - 3 + ((firstThursday.getDay() + 6) % 7)) / 7)).padStart(2, '0')}`;
    };
    const weekDates = (date = new Date()) => {
      const d = new Date(date);
      d.setHours(12, 0, 0, 0);
      const offset = (d.getDay() + 6) % 7;
      d.setDate(d.getDate() - offset);
      return Array.from({ length: 7 }, (_, i) => {
        const x = new Date(d);
        x.setDate(d.getDate() + i);
        return dateKey(x);
      });
    };
    const defaultDayType = (date = new Date()) => [0, 6].includes(date.getDay()) ? '休息日' : '工作日';
    const dayTypeLabel = type => type === '工作日' ? '工作日 / 学习日' : type;

    function normalizePlaceCounts(raw = {}) {
      const counts = Object.fromEntries(PLACES.map(place => [place, Number(raw[place] || 0)]));
      counts['任意地标'] += Number(raw['图书馆'] || 0);
      counts['商场'] += Number(raw['咖啡店'] || 0);
      return counts;
    }

    function createInitialState() {
      return {
        version: 1,
        initialized: true,
        profile: normalizeProfile(),
        settings: {
          photoEnabled: true,
          dayType: defaultDayType(),
          language: 'zh'
        },
        tasks: TASKS,
        dailyAssignment: null,
        history: {},
        records: [],
        collection: { unlockedTaskIds: [], unlockDates: {} },
        map: { litPlaceTypes: normalizePlaceCounts() },
        weekI: { weekKey: getWeekKey(), count: 0 }
      };
    }

    let state = createInitialState();
    const ui = {
      page: 'today',
      revealedTaskIds: new Set(),
      rollingTaskId: null,
      rollTimer: null,
      calendarMonth: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
      selectedRecordDate: dateKey(),
      recordViewKey: null,
      collectionFocus: null,
      collectionOpen: null,
      mapSeed: String(Date.now()) + Math.random(),
      recordEditingKey: null,
      recordDraft: { quickPhrase: '', note: '' },
      completion: { taskId: null, quickPhrase: '', note: '', photo: '' },
      locationTaskId: null,
      clearArmed: false,
      toastTimer: null
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return createInitialState();
        const saved = JSON.parse(raw);
        const base = createInitialState();
        return {
          ...base,
          ...saved,
          initialized: true,
          profile: normalizeProfile(saved.profile),
          settings: {
            ...base.settings,
            ...(saved.settings || {}),
            language: saved.settings?.language === 'en' ? 'en' : 'zh'
          },
          tasks: TASKS,
          dailyAssignment: saved.dailyAssignment || null,
          history: saved.history || {},
          records: Array.isArray(saved.records) ? saved.records : [],
          collection: {
            unlockedTaskIds: Array.isArray(saved.collection?.unlockedTaskIds) ? saved.collection.unlockedTaskIds : [],
            unlockDates: saved.collection?.unlockDates || {}
          },
          map: {
            litPlaceTypes: normalizePlaceCounts(saved.map?.litPlaceTypes || {})
          },
          weekI: { weekKey: getWeekKey(), count: 0, ...(saved.weekI || {}) }
        };
      } catch (error) {
        console.error('读取本机数据时遇到问题', error);
        return createInitialState();
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function escapeHTML(value = '') {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[char]));
    }

    function translateUiText(rawText) {
      const text = rawText.trim();
      if (!text) return '';
      if (UI_TRANSLATIONS[text]) return UI_TRANSLATIONS[text];
      if (CATEGORY_EN[text]) return CATEGORY_EN[text];
      if (PLACE_EN[text]) return PLACE_EN[text];
      if (PRESET_EN[text]) return PRESET_EN[text];
      const weekdays = { '一': 'Mon', '二': 'Tue', '三': 'Wed', '四': 'Thu', '五': 'Fri', '六': 'Sat', '日': 'Sun' };
      if (weekdays[text]) return weekdays[text];
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      let match;
      if ((match = text.match(/^(\d{4})年(\d{1,2})月(\d{1,2})日 · 周(.)$/))) {
        return `${months[Number(match[2]) - 1]} ${match[3]}, ${match[1]} · ${weekdays[match[4]]}`;
      }
      if ((match = text.match(/^(\d{1,2})月(\d{1,2})日 · 周(.)$/))) {
        return `${months[Number(match[1]) - 1]} ${match[2]} · ${weekdays[match[3]]}`;
      }
      if ((match = text.match(/^(\d{4})年(\d{1,2})月$/))) {
        return `${months[Number(match[2]) - 1]} ${match[1]}`;
      }
      if ((match = text.match(/^(\d{4})-W(\d{2}) · 本周回声$/))) {
        return `Week ${match[2]} · This week`;
      }
      if ((match = text.match(/^完成 (\d+) 项$/))) return `${match[1]} completed`;
      if ((match = text.match(/^(\d+) 天有记录 · 完成 (\d+) 项$/))) return `${match[1]} days with records · ${match[2]} completed`;
      if ((match = text.match(/^(\d+) 分钟$/))) return `${match[1]} min`;
      if ((match = text.match(/^(\d+) 次记录$/))) return `${match[1]} records`;
      if ((match = text.match(/^(\d+) \/ (\d+) 天$/))) return `${match[1]} / ${match[2]} days`;
      if ((match = text.match(/^已点亮 (\d+) 种 · 共 (\d+) 次$/))) return `${match[1]} types lit · ${match[2]} visits`;
      if ((match = text.match(/^已收集 (\d+) \/ (\d+)$/))) return `${match[1]} of ${match[2]} collected`;
      if ((match = text.match(/^多走两步 · (\d+)$/))) return `Extra tasks · ${match[1]}`;
      if ((match = text.match(/^小任务 (\d+)$/))) return `Side task ${match[1]}`;
      if ((match = text.match(/^多走两步 (\d+)$/))) return `Extra task ${match[1]}`;
      if ((match = text.match(/^(?:主线任务|主任务)(?: · (.+))?$/))) {
        return `Main quest${match[1] ? ` · ${match[1] === '已完成' ? 'Completed' : (CATEGORY_EN[match[1]] || match[1])}` : ''}`;
      }
      if ((match = text.match(/^(小任务|多走两步) (\d+)(?: · 已完成)?$/))) return `${match[1] === '小任务' ? 'Side task' : 'Extra task'} ${match[2]}${text.includes('已完成') ? ' · Completed' : ''}`;
      if ((match = text.match(/^(\d{4}-\d{2}-\d{2}) 解锁$/))) return `Unlocked ${match[1]}`;
      if ((match = text.match(/^已完成 \+(\d+)$/))) return `Completed +${match[1]}`;
      if ((match = text.match(/^数据只存本机，不上传。当前共 (\d+) 条记录。$/))) return `Stored only on this device. ${match[1]} records.`;
      return '';
    }

    function applyBilingualText(root) {
      if (!root) return;
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) {
        const node = walker.currentNode;
        if (!node.nodeValue.trim()) continue;
        if (node.parentElement?.closest('.bi-en,.task-en-title,.task-en-desc,.record-en,.task-en-mini,.brand-name,.brand-note,.map-stop__label,.map-home__label,script,style,option')) continue;
        if (translateUiText(node.nodeValue)) nodes.push(node);
      }
      nodes.forEach(node => {
        const english = translateUiText(node.nodeValue);
        if (!english) return;
        const chinese = document.createElement('span');
        chinese.className = 'bi-zh';
        chinese.textContent = node.nodeValue.trim();
        const span = document.createElement('span');
        span.className = 'bi-en';
        span.setAttribute('aria-hidden', 'true');
        span.textContent = english;
        node.parentNode.replaceChild(chinese, node);
        chinese.parentNode.insertBefore(span, chinese.nextSibling);
      });
    }

    function applyLanguage() {
      const language = ['zh', 'en'].includes(state.settings.language)
        ? state.settings.language
        : 'zh';
      if (state.settings.language !== language) {
        state.settings.language = language;
        try { saveState(); } catch (error) { console.error(error); }
      }
      state.settings.language = language;
      document.documentElement.dataset.language = language;
      document.documentElement.lang = language === 'en' ? 'en' : 'zh-CN';
    }

    function showToast(message, duration = 2600) {
      const wrap = document.getElementById('toast-wrap');
      if (!wrap) return;
      wrap.innerHTML = `<div class="toast">${icon('spark', 18)}<span>${escapeHTML(message)}</span></div>`;
      applyBilingualText(wrap);
      applyLanguage();
      clearTimeout(ui.toastTimer);
      ui.toastTimer = setTimeout(() => { wrap.innerHTML = ''; }, duration);
    }

    function task(id) {
      return TASK_BY_ID[id] || { id, name: '未知任务', desc: '', minutes: '', completion: '', category: '', xp: 0 };
    }

    function availableMinutes(dayType = state.settings.dayType) {
      const candidate = dayType === '休息日' ? Number(state.profile.restMinutes) : Number(state.profile.workMinutes);
      if (dayType === '休息日') return Math.max(150, candidate || 60);
      return Math.max(1, candidate || 15);
    }

    function mainCompletedToday() {
      const d = state.dailyAssignment;
      return Boolean(d && (d.completedTaskIds || []).includes(d.mainTaskId));
    }

    function completedIdsToday() {
      return new Set(state.dailyAssignment?.completedTaskIds || []);
    }

    function totalXP() {
      return state.records.reduce((sum, record) => sum + Number(record.xp || 0), 0);
    }

    function syncHistoryEntry(assignment = state.dailyAssignment) {
      if (!assignment?.date) return;
      const prior = state.history[assignment.date] || {};
      const completed = new Set([...(assignment.completedTaskIds || []), ...(prior.completedTaskIds || [])]);
      state.history[assignment.date] = {
        date: assignment.date,
        dayType: assignment.dayType,
        mainTaskId: assignment.mainTaskId,
        completedMain: prior.completedMain || completed.has(assignment.mainTaskId),
        completedTaskIds: Array.from(completed)
      };
    }

    function hasMainDoneOn(key) {
      if (state.history[key]?.completedMain) return true;
      return state.records.some(record => record.date === key && record.done && !record.taskId.startsWith('M'));
    }

    function consecutiveBreakForced() {
      if (!state.profile.createdDate || dayDistance(state.profile.createdDate, dateKey()) < 3) return false;
      return [1, 2, 3].every(offset => !hasMainDoneOn(addDays(dateKey(), -offset)));
    }

    function transportAllows(t) {
      const prefix = t.id[0];
      if (!['G', 'I'].includes(prefix)) return true;
      const transport = state.profile.transport;
      const walking = ['G2', 'G3', 'G5', 'G9', 'G10', 'I1', 'I7', 'I8', 'I9'];
      const bus = [...walking, 'G1', 'G4', 'G8', 'I5'];
      const car = [...walking, 'G1', 'G4', 'G7', 'G8', 'I2', 'I3', 'I4'];
      if (transport === '公交') return bus.includes(t.id);
      if (transport === '自驾') return car.includes(t.id);
      return walking.includes(t.id);
    }

    function eligibleMainTasks({ isLow = false, reroll = false, gapForced = false } = {}) {
      const minutes = availableMinutes(state.settings.dayType);
      const allowedF = new Set(['F1', 'F2', 'F5', 'F7', 'F10']);
      const seen = new Set(state.dailyAssignment?.seenMainIds || []);
      const skipped = new Set(state.dailyAssignment?.skippedMainIds || []);
      if (reroll) {
        seen.clear();
        if (state.dailyAssignment?.mainTaskId) seen.add(state.dailyAssignment.mainTaskId);
      }
      return MAIN_TASKS.filter(t => {
        if (t.maxMinutes > minutes) return false;
        if (skipped.has(t.id)) return false;
        if (seen.has(t.id)) return false;
        if (gapForced || isLow) return t.category === '低电量';
        const prefix = t.id[0];
        if (state.profile.preset === '随机') {
          if (prefix === 'I' && getWeekKey() === state.weekI.weekKey && state.weekI.count >= 1) return false;
          if (state.settings.dayType === '工作日' && ['G', 'I', 'J', 'K'].includes(prefix)) return false;
          return true;
        }
        if (state.settings.dayType === '工作日' && ['G', 'I', 'J', 'K'].includes(prefix)) return false;
        if (state.profile.movement === '很低' && t.id === 'D5') return false;
        if (state.profile.social === '独处恢复' && prefix === 'F' && !allowedF.has(t.id)) return false;
        if (state.profile.social === '独处恢复' && prefix === 'I' && t.social === '熟人可选') return false;
        if (state.profile.social === '独处恢复' && t.id === 'G7' && state.settings.dayType === '工作日') return false;
        if (!transportAllows(t)) return false;
        if (prefix === 'I' && getWeekKey() === state.weekI.weekKey && state.weekI.count >= 1) return false;
        return true;
      });
    }

    function weightForTask(t) {
      let weight = 1;
      if (state.profile.preset === '随机') {
        if (state.settings.dayType === '休息日' && t.id[0] === 'K') weight *= 18;
        if (state.settings.dayType === '休息日' && t.id[0] !== 'K' && t.minMinutes >= 30) weight *= 4;
        if (state.settings.dayType === '休息日' && t.id[0] !== 'K' && t.minMinutes < 30) weight *= .35;
        if (state.settings.dayType === '休息日' && ['G', 'I', 'J'].includes(t.id[0])) weight *= 1.85;
        return weight;
      }
      if (Array.isArray(state.profile.preferences) && state.profile.preferences.includes(t.category)) weight *= 2;
      if (state.settings.dayType === '休息日' && t.id[0] === 'K') weight *= 18;
      if (state.settings.dayType === '休息日' && t.id[0] !== 'K' && t.minMinutes >= 30) weight *= 4;
      if (state.settings.dayType === '休息日' && t.id[0] !== 'K' && t.minMinutes < 30) weight *= .35;
      if (state.settings.dayType === '休息日' && ['G', 'I', 'J'].includes(t.id[0])) weight *= 1.85;
      if (state.settings.dayType === '休息日' && state.profile.outing === '低' && t.social === '零社交') weight *= 1.25;
      if (state.profile.movement === '只接受走路' && t.body === '走路') weight *= 1.45;
      if (state.profile.social === '独处恢复' && t.category === '线上社交') weight *= .8;
      return weight;
    }

    function weightedPick(items) {
      if (!items.length) return null;
      const weights = items.map(weightForTask);
      const total = weights.reduce((a, b) => a + b, 0);
      let cursor = Math.random() * total;
      for (let i = 0; i < items.length; i += 1) {
        cursor -= weights[i];
        if (cursor <= 0) return items[i];
      }
      return items[items.length - 1];
    }

    function chooseMainTask({ reroll = false } = {}) {
      const low = state.settings.dayType === '低电量日';
      const forced = consecutiveBreakForced();
      let pool = eligibleMainTasks({ isLow: low, reroll, gapForced: forced });
      if (!pool.length && reroll) {
        state.dailyAssignment.skippedMainIds = [];
        pool = eligibleMainTasks({ isLow: low, reroll, gapForced: forced });
      }
      if (!pool.length) {
        pool = MAIN_TASKS.filter(t => t.maxMinutes <= availableMinutes()
          && (state.settings.dayType !== '工作日' || t.id[0] !== 'K')
          && (!low && !forced || t.category === '低电量'));
      }
      if (!pool.length) pool = MAIN_TASKS.filter(t => t.category === '低电量');
      return { picked: weightedPick(pool), forced };
    }

    function chooseAnchors() {
      const pool = [...ANCHOR_TASKS];
      const result = [];
      while (result.length < 2 && pool.length) {
        const index = Math.floor(Math.random() * pool.length);
        result.push(pool.splice(index, 1)[0]);
      }
      return result;
    }

    function chooseExtraTask() {
      const minutes = availableMinutes();
      const active = new Set([
        state.dailyAssignment?.mainTaskId,
        ...(state.dailyAssignment?.anchorIds || []),
        ...(state.dailyAssignment?.extraTaskIds || [])
      ].filter(Boolean));
      const allowedF = new Set(['F1', 'F2', 'F5', 'F7', 'F10']);
      const eligible = TASKS.filter(t => {
        if (t.maxMinutes > minutes) return false;
        if (state.settings.dayType === '低电量日') return t.category === '低电量';
        const prefix = t.id[0];
        if (state.profile.preset === '随机') {
          if (state.settings.dayType === '工作日' && ['G', 'I', 'J', 'K'].includes(prefix)) return false;
          if (prefix === 'I' && getWeekKey() === state.weekI.weekKey && state.weekI.count >= 1) return false;
          return true;
        }
        if (state.settings.dayType === '工作日' && ['G', 'I', 'J', 'K'].includes(prefix)) return false;
        if (state.profile.movement === '很低' && t.id === 'D5') return false;
        if (state.profile.social === '独处恢复' && prefix === 'F' && !allowedF.has(t.id)) return false;
        if (state.profile.social === '独处恢复' && prefix === 'I' && t.social === '熟人可选') return false;
        if (prefix === 'I' && getWeekKey() === state.weekI.weekKey && state.weekI.count >= 1) return false;
        return transportAllows(t);
      });
      const unseen = eligible.filter(t => !active.has(t.id));
      return weightedPick(unseen.length ? unseen : eligible);
    }

    function buildAssignment({ preserveAnchors = false } = {}) {
      state.settings.dayType = DAY_TYPES.includes(state.settings.dayType) ? state.settings.dayType : defaultDayType();
      const result = chooseMainTask();
      if (!result.picked) return false;
      const previousSeen = state.dailyAssignment?.date === dateKey() ? (state.dailyAssignment.seenMainIds || []) : [];
      const previousAnchors = state.dailyAssignment?.date === dateKey() ? state.dailyAssignment.anchorIds : null;
      const previousExtras = state.dailyAssignment?.date === dateKey() ? (state.dailyAssignment.extraTaskIds || []) : [];
      const chosenAnchors = preserveAnchors && previousAnchors?.length === 2
        ? previousAnchors
        : chooseAnchors().map(t => t.id);
      state.dailyAssignment = {
        date: dateKey(),
        dayType: state.settings.dayType,
        mainTaskId: result.picked.id,
        anchorIds: chosenAnchors,
        rerollUsed: preserveAnchors ? Boolean(state.dailyAssignment?.rerollUsed) : false,
        skippedMainIds: preserveAnchors ? (state.dailyAssignment?.skippedMainIds || []) : [],
        status: 'pending',
        completedTaskIds: preserveAnchors ? (state.dailyAssignment?.completedTaskIds || []) : [],
        extraTaskIds: preserveAnchors ? previousExtras : [],
        seenMainIds: Array.from(new Set([...previousSeen, result.picked.id])),
        gapForced: result.forced
      };
      if (getWeekKey() !== state.weekI.weekKey) state.weekI = { weekKey: getWeekKey(), count: 0 };
      if (result.picked.id.startsWith('I')) {
        state.weekI.count = Number(state.weekI.count || 0) + 1;
      }
      syncHistoryEntry();
      return true;
    }

    function ensureToday() {
      if (!state.initialized) return;
      const currentDate = dateKey();
      if (getWeekKey() !== state.weekI.weekKey) state.weekI = { weekKey: getWeekKey(), count: 0 };
      if (state.dailyAssignment?.date === currentDate) {
        const scheduledType = defaultDayType();
        if (state.settings.dayType !== scheduledType || state.dailyAssignment.dayType !== scheduledType) {
          state.settings.dayType = scheduledType;
          state.dailyAssignment.dayType = scheduledType;
          if (!mainCompletedToday()) regenerateForSettings();
          syncHistoryEntry();
          try { saveState(); } catch (error) { console.error(error); }
        }
        return;
      }
      if (state.dailyAssignment?.date) syncHistoryEntry();
      state.settings.dayType = defaultDayType();
      buildAssignment();
      try { saveState(); } catch (error) { console.error(error); }
    }

    function formatDate(key, withYear = false) {
      const d = parseDateKey(key);
      return `${withYear ? `${d.getFullYear()}年` : ''}${d.getMonth() + 1}月${d.getDate()}日`;
    }

    function weekdayName(key) {
      return ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][parseDateKey(key).getDay()];
    }

    const NAV_ITEMS = [
      ['today', '今日偶遇', 'home'],
      ['records', '小家书桌', 'book'],
      ['collection', '村民图鉴', 'spark'],
      ['map', '足迹', 'map'],
      ['more', '设置', 'settings']
    ];

    function topbar() {
      return `
        <header class="topbar">
          <div class="brand">
            <div class="brand-mark"><img class="brand-avatar" src="${SHARK_ICON}" alt=""></div>
            <div class="brand-copy">
              <span class="brand-name">太阳谷</span>
              <span class="brand-note">Serendipity</span>
            </div>
          </div>
          <div class="xp-mark">${icon('spark', 15)}<span>${totalXP()} XP</span></div>
        </header>`;
    }

    function bottomNav() {
      return `
        <nav class="bottom-nav" aria-label="主要页面">
          ${NAV_ITEMS.map(([id, label, iconName]) => `
            <button class="nav-btn ${ui.page === id ? 'is-active' : ''}" data-action="navigate" data-page="${id}" aria-current="${ui.page === id ? 'page' : 'false'}">
              ${NAV_ART[id] ? `<img class="nav-art" src="${NAV_ART[id]}" alt="">` : icon(iconName, 21)}
              <span>${label}</span>
            </button>`).join('')}
        </nav>`;
    }

    function layout(content, options = {}) {
      const noNav = options.noNav;
      return `
        <div class="${options.wizard ? 'wizard-wrap' : 'page'}">
          ${noNav ? '' : topbar()}
          ${content}
        </div>
        ${noNav ? '' : bottomNav()}
        ${renderCompletionSheet()}
        ${renderLocationSheet()}
        ${renderRecordSheet()}`;
    }

    function todayView() {
      if (!state.dailyAssignment) {
        buildAssignment();
        try { saveState(); } catch (error) { console.error(error); }
      }
      const assignment = state.dailyAssignment;
      const mainTask = task(assignment.mainTaskId);
      const done = completedIdsToday();
      const extraTaskIds = Array.isArray(assignment.extraTaskIds) ? assignment.extraTaskIds : [];
      const mainDone = done.has(mainTask.id);
      const gapMessage = assignment.gapForced || assignment.dayType === '低电量日'
        ? `<div class="notice">${icon('moon', 19)}<span>低电量降级，仍然算今天有照顾自己。做一个小动作就很好。</span></div>`
        : '';
      return layout(`
        <section class="today-home-head">
          <div>
            <div class="today-date">${formatDate(assignment.date)} · ${weekdayName(assignment.date)}</div>
            <h1><span>今天偶遇了哪位村民？</span></h1>
          </div>
          <span class="mode-chip">${icon('spark', 13)} ${dayTypeLabel(assignment.dayType)}</span>
        </section>
        ${gapMessage}
        ${ui.revealedTaskIds.has(mainTask.id) ? `
          <article class="simple-task is-main ${mainDone ? 'is-done' : ''}" id="task-card-${mainTask.id}" tabindex="-1" aria-labelledby="main-task-title">
            <span class="npc-badge"><img class="npc-on-card" src="${NPC_IMG[mainTask.category] || ''}" alt=""><span class="npc-tag">${(NPC_INFO[mainTask.category] || {}).name || ''}<em>${(NPC_INFO[mainTask.category] || {}).role || ''}</em></span></span>
            <div class="task-body revealed-content">
              <div class="simple-task-head">
                <span class="task-type-label">主线任务 · ${mainTask.category}</span>
                <span>${mainDone ? '已完成' : `+${mainTask.xp} XP`}</span>
              </div>
              <h2 id="main-task-title"><span class="task-zh-title">${escapeHTML(mainTask.name)}</span><span class="task-en-title">${escapeHTML(mainTask.enName)}</span></h2>
              <p><span class="task-zh-desc">${escapeHTML(mainTask.desc)}</span><span class="task-en-desc">${escapeHTML(mainTask.enDesc)}</span></p>
              <div class="simple-task-meta">
                <span>${icon('clock', 12)} ${mainTask.minutes} 分钟</span>
                <span>${mainTask.completion}</span>
              </div>
              <div class="simple-task-actions">
                ${mainDone
                  ? `<span class="done-badge">${icon('check', 18)} 已完成，今天这里收好</span>`
                  : `<button class="btn btn-primary" data-action="open-complete" data-task-id="${mainTask.id}">${icon('check', 18)} 搞定</button>`}
                ${mainDone
                  ? ''
                  : `<button class="tiny-action reroll-corner" data-action="reroll">${icon('refresh', 15)} 换一个</button>
                     <button class="tiny-action" data-action="skip-main">当前做不了</button>`}
              </div>
            </div>
          </article>` : `
          <article class="simple-task is-main task-hidden ${mainDone ? 'is-done' : ''} ${ui.rollingTaskId === mainTask.id ? 'is-rolling' : ''}" id="task-card-${mainTask.id}" tabindex="-1" aria-busy="${ui.rollingTaskId === mainTask.id}">
            <button class="task-cover" data-action="reveal-task" data-task-id="${mainTask.id}" aria-label="揭晓主线任务">
              <span class="task-cover-copy">
                <span class="task-cover-kicker">主线任务${mainDone ? ' · 已完成' : ''}</span>
                <span class="task-cover-title">${ui.rollingTaskId === mainTask.id ? '正在随机翻牌' : '迎面遇上了……'}</span>
                ${ui.rollingTaskId === mainTask.id ? '<span class="task-cover-note">从任务池里抽一张<span class="roll-dots" aria-hidden="true"><i></i><i></i><i></i></span></span>' : ''}
              </span>
              <span class="task-cover-mark">${icon(ui.rollingTaskId === mainTask.id ? 'refresh' : 'spark', 23)}</span>
            </button>
          </article>`}
        <div class="micro-task-head">
          <h2>随便逛逛遇到了</h2>
          <span>看心情吧</span>
        </div>
        <section class="micro-task-grid">
          ${assignment.anchorIds.map((id, index) => {
            const t = task(id);
            const isDone = done.has(id);
            return `
              ${ui.revealedTaskIds.has(t.id) ? `
                <article class="simple-task micro-task ${isDone ? 'is-done' : ''}" id="task-card-${t.id}" tabindex="-1">
                  <span class="npc-badge"><img class="npc-on-card" src="${NPC_IMG[t.category] || ''}" alt=""><span class="npc-tag">${(NPC_INFO[t.category] || {}).name || ''}<em>${(NPC_INFO[t.category] || {}).role || ''}</em></span></span>
                  <div class="task-body revealed-content">
                    <div class="simple-task-head">
                      <span>小任务 0${index + 1}</span>
                      <span>${isDone ? '已完成' : `+${t.xp} XP`}</span>
                    </div>
                    <h3><span class="task-zh-title">${escapeHTML(t.name)}</span><span class="task-en-title">${escapeHTML(t.enName)}</span></h3>
                    <p><span class="task-zh-desc">${escapeHTML(t.desc)}</span><span class="task-en-desc">${escapeHTML(t.enDesc)}</span></p>
                    <div class="simple-task-meta"><span>${t.minutes} 分钟</span><span>${t.completion}</span></div>
                    <div class="simple-task-actions">
                      ${isDone
                        ? `<button class="btn" type="button" disabled>${icon('check', 17)} 已完成</button>`
                        : `<button class="btn" data-action="open-complete" data-task-id="${t.id}">搞定</button>`}
                    </div>
                  </div>
                </article>` : `
                <article class="simple-task micro-task task-hidden ${isDone ? 'is-done' : ''} ${ui.rollingTaskId === t.id ? 'is-rolling' : ''}" id="task-card-${t.id}" tabindex="-1" aria-busy="${ui.rollingTaskId === t.id}">
                  <button class="task-cover" data-action="reveal-task" data-task-id="${t.id}" aria-label="揭晓小任务 ${index + 1}">
                    <span class="task-cover-copy">
                      <span class="task-cover-kicker">小任务 0${index + 1}${isDone ? ' · 已完成' : ''}</span>
                      <span class="task-cover-title">${ui.rollingTaskId === t.id ? '正在随机翻牌' : '真巧，你也在'}</span>
                      ${ui.rollingTaskId === t.id ? '<span class="task-cover-note">从任务池里抽一张<span class="roll-dots" aria-hidden="true"><i></i><i></i><i></i></span></span>' : ''}
                    </span>
                    <span class="task-cover-mark">${icon(ui.rollingTaskId === t.id ? 'refresh' : 'spark', 20)}</span>
                  </button>
                </article>`}`;
          }).join('')}
        </section>
        ${extraTaskIds.length ? `
          <div class="micro-task-head">
            <h2>多走两步 · ${extraTaskIds.length}</h2>
            <span>心情好，多偶遇几个</span>
          </div>
          <section class="micro-task-grid">
            ${extraTaskIds.map((id, index) => {
              const t = task(id);
              const isDone = done.has(id);
              return `
                ${ui.revealedTaskIds.has(t.id) ? `
                  <article class="simple-task micro-task extra-task ${isDone ? 'is-done' : ''}" id="task-card-${t.id}" tabindex="-1">
                    <span class="npc-badge"><img class="npc-on-card" src="${NPC_IMG[t.category] || ''}" alt=""><span class="npc-tag">${(NPC_INFO[t.category] || {}).name || ''}<em>${(NPC_INFO[t.category] || {}).role || ''}</em></span></span>
                    <div class="task-body revealed-content">
                      <div class="simple-task-head">
                        <span>多走两步 ${String(index + 1).padStart(2, '0')}</span>
                        <span>${isDone ? '已完成' : `+${t.xp} XP`}</span>
                      </div>
                      <h3><span class="task-zh-title">${escapeHTML(t.name)}</span><span class="task-en-title">${escapeHTML(t.enName)}</span></h3>
                      <p><span class="task-zh-desc">${escapeHTML(t.desc)}</span><span class="task-en-desc">${escapeHTML(t.enDesc)}</span></p>
                      <div class="simple-task-meta"><span>${t.minutes} 分钟</span><span>${t.completion}</span></div>
                      <div class="simple-task-actions">
                        ${isDone
                          ? `<button class="btn" type="button" disabled>${icon('check', 17)} 已完成</button>`
                          : `<button class="btn" data-action="open-complete" data-task-id="${t.id}">搞定</button>`}
                      </div>
                    </div>
                  </article>` : `
                  <article class="simple-task micro-task extra-task task-hidden ${isDone ? 'is-done' : ''} ${ui.rollingTaskId === t.id ? 'is-rolling' : ''}" id="task-card-${t.id}" tabindex="-1" aria-busy="${ui.rollingTaskId === t.id}">
                    <button class="task-cover" data-action="reveal-task" data-task-id="${t.id}" aria-label="揭晓多走两步 ${index + 1}">
                      <span class="task-cover-copy">
                        <span class="task-cover-kicker">多走两步 ${String(index + 1).padStart(2, '0')}${isDone ? ' · 已完成' : ''}</span>
                        <span class="task-cover-title">${ui.rollingTaskId === t.id ? '正在随机翻牌' : '真巧，你也在'}</span>
                        ${ui.rollingTaskId === t.id ? '<span class="task-cover-note">从任务池里抽一张<span class="roll-dots" aria-hidden="true"><i></i><i></i><i></i></span></span>' : ''}
                      </span>
                      <span class="task-cover-mark">${icon(ui.rollingTaskId === t.id ? 'refresh' : 'spark', 20)}</span>
                    </button>
                  </article>`}`;
            }).join('')}
          </section>` : ''}
        <section class="extra-draw">
          <div>
            <strong>前面还有人</strong>
          </div>
          <button class="btn btn-secondary" data-action="add-extra">${icon('spark', 17)} 跟“他”聊聊</button>
        </section>
      `);
    }

    function renderCompletionSheet() {
      const taskId = ui.completion.taskId;
      if (!taskId) return '';
      const t = task(taskId);
      const photoAllowed = state.settings.photoEnabled;
      return `
        <div class="overlay" data-action="close-sheet">
          <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="complete-title" data-stop-close>
            <div class="sheet-head">
              <div>
                <p class="eyebrow">完成记录</p>
                <h2 id="complete-title"><span class="task-zh-title">${escapeHTML(t.name)}</span><span class="task-en-title">${escapeHTML(t.enName)}</span></h2>
                <p>给今天留下一个小记号，不想写也可以。</p>
              </div>
              <button class="icon-btn" type="button" data-action="close-sheet" aria-label="关闭">${icon('close', 19)}</button>
            </div>
            <form data-form="completion">
              <div class="field">
                <span class="field-label">此刻的感觉 <em>可跳过</em></span>
                <div class="chip-row">
                  ${QUICK_PHRASES.map(phrase => `<button type="button" class="chip ${ui.completion.quickPhrase === phrase ? 'is-active' : ''}" data-action="quick-phrase" data-phrase="${phrase}">${phrase}</button>`).join('')}
                </div>
              </div>
              <label class="field">
                <span class="field-label">备注 <em>可留空</em></span>
                <textarea class="control" name="note" data-completion-note placeholder="${state.settings.language === 'en' ? 'e.g. Two minutes was enough.' : '比如：只做了两分钟，也很够了。'}">${escapeHTML(ui.completion.note)}</textarea>
              </label>
              ${photoAllowed ? `
                <div class="field">
                  <span class="field-label">照片 <em>可选，仅本机保存</em></span>
                  <label class="upload-box">
                    <span>${icon('camera', 19)} ${ui.completion.photo ? '换一张照片' : '拍一张或选择照片'}</span>
                    <span class="faint">最长边 800px</span>
                    <input type="file" accept="image/*" data-photo-input>
                  </label>
                  ${ui.completion.photo ? `<img class="photo-preview" src="${ui.completion.photo}" alt="待保存的照片预览">` : ''}
                </div>` : `
                <div class="notice notice-calm">${icon('shield', 18)}<span>照片记录目前关闭；完成状态仍会保存。</span></div>`}
              <div class="sheet-actions">
                <button type="button" class="btn btn-secondary" data-action="close-sheet">晚点再说</button>
                <button type="submit" class="btn btn-primary">${icon('check', 18)} 保存完成</button>
              </div>
            </form>
          </section>
        </div>`;
    }

    function renderLocationSheet() {
      if (!ui.locationTaskId) return '';
      return `
        <div class="overlay">
          <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="place-title">
            <div class="sheet-head">
              <div>
                <p class="eyebrow">地图点亮</p>
                <h2 id="place-title">今天在哪里发生？</h2>
                <p>只记录地点类型和次数，不保存位置，也不请求定位。</p>
              </div>
            </div>
            <div class="place-choices">
              ${PLACES.map(place => `<button class="place-choice" data-action="choose-place" data-place="${place}">${place}</button>`).join('')}
            </div>
            <div class="sheet-actions">
              <button class="btn btn-secondary btn-wide" data-action="skip-place">这次不记录地点</button>
            </div>
          </section>
        </div>`;
    }

    function renderRecordSheet() {
      if (!ui.recordViewKey) return '';
      const record = state.records.find(r => r.createdAt === ui.recordViewKey);
      if (!record) return '';
      const t = task(record.taskId);
      const when = record.createdAt ? new Date(record.createdAt) : null;
      const timeText = when && !isNaN(when)
        ? `${String(when.getHours()).padStart(2, '0')}:${String(when.getMinutes()).padStart(2, '0')}`
        : '';
      const kindText = record.kind === 'extra'
        ? '多走两步'
        : (record.kind === 'anchor' || record.taskId.startsWith('M')) ? '路边偶遇' : '主线任务';
      const editing = ui.recordEditingKey === record.createdAt;
      const head = `
            <div class="sheet-head">
              <div>
                <p class="eyebrow">${formatDate(record.date, true)}${timeText ? ' · ' + timeText : ''}</p>
                <h2 id="record-title">${escapeHTML(t.name)}</h2>
                <p class="record-en">${escapeHTML(t.enName)}</p>
              </div>
              <button class="icon-btn" type="button" data-action="close-record" aria-label="关闭">${icon('close', 19)}</button>
            </div>`;

      if (editing) {
        return `
        <div class="overlay" data-action="close-record">
          <section class="sheet record-sheet" role="dialog" aria-modal="true" aria-labelledby="record-title" data-stop-close>
            ${head}
            <form data-form="record-edit" data-key="${escapeHTML(record.createdAt)}">
              <div class="field">
                <span class="field-label">此刻的感觉 <em>可跳过</em></span>
                <div class="chip-row">
                  ${QUICK_PHRASES.map(phrase => `<button type="button" class="chip ${ui.recordDraft.quickPhrase === phrase ? 'is-active' : ''}" data-action="record-phrase" data-phrase="${phrase}">${phrase}</button>`).join('')}
                </div>
              </div>
              <label class="field">
                <span class="field-label">备注 <em>可留空</em></span>
                <textarea class="control" name="note" data-record-note placeholder="改一改当时留下的那句话。">${escapeHTML(ui.recordDraft.note || '')}</textarea>
              </label>
              <div class="sheet-actions">
                <button type="button" class="btn btn-secondary btn-wide" data-action="cancel-record-edit">取消</button>
                <button type="submit" class="btn btn-primary btn-wide">保存修改</button>
              </div>
            </form>
          </section>
        </div>`;
      }

      return `
        <div class="overlay" data-action="close-record">
          <section class="sheet record-sheet" role="dialog" aria-modal="true" aria-labelledby="record-title" data-stop-close>
            ${head}
            <p class="record-detail-desc">${escapeHTML(t.desc || '')}</p>
            <div class="record-detail-meta">
              <span>${escapeHTML(t.category)}</span>
              <span>${kindText}</span>
              <span>+${record.xp} XP</span>
            </div>
            ${record.quickPhrase ? `<p class="record-note">${escapeHTML(record.quickPhrase)}</p>` : ''}
            ${record.note ? `<p class="record-note">${escapeHTML(record.note)}</p>` : ''}
            ${record.photo ? `<img class="record-detail-photo" src="${record.photo}" alt="${escapeHTML(t.name)}的照片">` : ''}
            <div class="sheet-actions">
              <button type="button" class="btn btn-secondary btn-wide" data-action="edit-record">${icon('feather', 16)} 编辑记录</button>
            </div>
          </section>
        </div>`;
    }

    function saveRecordEdit(form) {
      const key = form.dataset.key;
      const record = state.records.find(r => r.createdAt === key);
      if (!record) return;
      const fd = new FormData(form);
      record.note = String(fd.get('note') || '').slice(0, 800);
      record.quickPhrase = ui.recordDraft.quickPhrase || '';
      saveSafely(true);
      ui.recordEditingKey = null;
      render();
      showToast('记录已更新。');
    }

    function recordsView() {
      const year = ui.calendarMonth.getFullYear();
      const month = ui.calendarMonth.getMonth();
      const monthStart = new Date(year, month, 1);
      const startOffset = monthStart.getDay();
      const calendarStart = new Date(year, month, 1 - startOffset);
      const cells = Array.from({ length: 42 }, (_, index) => {
        const date = new Date(calendarStart.getFullYear(), calendarStart.getMonth(), calendarStart.getDate() + index);
        const key = dateKey(date);
        const records = state.records.filter(record => record.date === key && record.done);
        return { date, key, records, inMonth: date.getMonth() === month };
      });
      const monthRecords = state.records.filter(record => {
        const date = parseDateKey(record.date);
        return record.done && date.getFullYear() === year && date.getMonth() === month;

      const completedDays = new Set(monthRecords.map(record => record.date));
      const selectedDate = ui.selectedRecordDate || dateKey();

        .sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
