<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8e2df">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" id="app-icon" type="image/png">
  <link rel="apple-touch-icon" id="app-touch-icon">
  <title>i人小副本 · Solo Side Quest</title>
  <style>
    :root {
      --paper: #f8e2df;
      --paper-deep: #e8c2bd;
      --surface: #fff5ef;
      --surface-soft: #fae7de;
      --ink: #432a25;
      --ink-soft: #77554d;
      --ink-faint: #a57d72;
      --line: #dfb9b0;
      --forest: #b34f3d;
      --forest-deep: #87372d;
      --sage: #bf765f;
      --sage-soft: #f2cfbf;
      --peach: #e47d5b;
      --peach-soft: #f9d3c1;
      --lilac: #a56360;
      --lilac-soft: #efd3ce;
      --danger: #982f27;
      --shadow: 0 16px 45px rgba(111, 52, 43, .12);
      --shadow-soft: 0 8px 24px rgba(111, 52, 43, .08);
      --radius-xl: 28px;
      --radius-lg: 21px;
      --radius-md: 15px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --sans: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      --serif: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--paper); }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 9% 2%, rgba(228, 125, 91, .24), transparent 25rem),
        radial-gradient(circle at 92% 18%, rgba(183, 109, 114, .2), transparent 28rem),
        var(--paper);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.72;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, input, select, textarea { font: inherit; color: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 3px solid rgba(47, 81, 68, .26);
      outline-offset: 3px;
    }
    button:disabled { cursor: not-allowed; opacity: .52; }
    img { display: block; max-width: 100%; }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { font-family: var(--serif); font-weight: 800; letter-spacing: -.015em; }
    svg { display: block; }
    .bi-en {
      display: block;
      margin-top: 2px;
      color: var(--ink-faint);
      font-family: var(--sans);
      font-size: max(9px, .68em);
      font-weight: 500;
      letter-spacing: 0;
      line-height: 1.35;
      text-transform: none;
    }
    .mode-chip .bi-en,
    .record-phrase .bi-en {
      display: inline;
      margin: 0 0 0 3px;
      font-size: 8px;
    }
    button .bi-en { margin-top: 1px; font-size: 8px; line-height: 1.15; }
    .nav-btn .bi-en { font-size: 8px; line-height: 1.1; opacity: .9; }
    html[data-language="zh"] .bi-en,
    html[data-language="zh"] .task-en-title,
    html[data-language="zh"] .task-en-desc,
    html[data-language="zh"] .record-en,
    html[data-language="zh"] .task-en-mini {
      display: none !important;
    }
    html[data-language="en"] .bi-zh,
    html[data-language="en"] .task-zh-title,
    html[data-language="en"] .task-zh-desc {
      display: none !important;
    }
    html[data-language="en"] .bi-en {
      margin-top: 0;
      color: var(--ink-soft);
      font-size: .92em;
      font-weight: 600;
      line-height: 1.58;
    }
    html[data-language="en"] h1 .bi-en,
    html[data-language="en"] h2 .bi-en,
    html[data-language="en"] h3 .bi-en {
      color: inherit;
      font-size: .82em;
      font-weight: 800;
      line-height: 1.4;
    }
    html[data-language="en"] p .bi-en { color: var(--ink-soft); font-size: 1em; }
    html[data-language="en"] button .bi-en {
      margin: 0;
      color: inherit;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.25;
    }
    html[data-language="en"] .nav-btn .bi-en {
      font-size: 10px;
      font-weight: 700;
      line-height: 1.2;
    }
    html[data-language="en"] .mode-chip .bi-en,
    html[data-language="en"] .record-phrase .bi-en {
      font-size: 10px;
      font-weight: 700;
    }
    html[data-language="en"] .today-home-head h1 span { white-space: normal; }
    html[data-language="en"] .simple-task h2 .task-en-title {
      margin-bottom: 9px;
      color: inherit;
      font-size: clamp(26px, 6.4vw, 35px);
      font-weight: 800;
      line-height: 1.36;
    }
    html[data-language="en"] .micro-task h3 .task-en-title {
      margin-bottom: 8px;
      font-size: 15px;
      line-height: 1.5;
    }
    html[data-language="en"] .task-en-desc {
      margin-top: 0;
      color: var(--ink-soft);
      font-size: 13px;
      line-height: 1.75;
    }
    html[data-language="en"] .is-main .task-en-title { color: #fffaf0; }
    html[data-language="en"] .is-main .task-en-desc {
      color: rgba(255,250,240,.9);
      font-size: 15px;
      line-height: 1.8;
    }
    html[data-language="en"] .is-main .simple-task-head .bi-en,
    html[data-language="en"] .is-main .simple-task-meta .bi-en {
      color: rgba(255,250,240,.82);
      font-size: 12px;
      font-weight: 650;
    }
    html[data-language="en"] .task-cover-kicker .bi-en {
      color: inherit;
      font-size: 13px;
      font-weight: 750;
    }
    html[data-language="en"] .task-cover-note .bi-en {
      font-size: 12px;
    }
    html[data-language="en"] .record-en { color: var(--ink-soft); font-size: 12px; }
    html[data-language="en"] .task-en-mini { color: var(--ink-soft); font-size: 11px; line-height: 1.5; }
    html[data-language="en"] .preset-en { color: var(--ink-soft); font-size: 13px; line-height: 1.6; }

    .shell {
      position: relative;
      width: min(100%, 760px);
      min-height: 100vh;
      margin: 0 auto;
      overflow: clip;
    }

    .page {
      padding: 22px clamp(18px, 4vw, 34px) calc(126px + var(--safe-bottom));
      animation: settle .28s ease both;
    }

    @keyframes settle {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: clamp(24px, 5vw, 40px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      overflow: hidden;
      padding: 0;
      border-radius: 50%;
      color: #fff9ec;
      background: var(--forest);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.1);
    }
    .brand-avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-copy { min-width: 0; }
    .brand-name {
      display: block;
      font-family: var(--serif);
      font-weight: 800;
      font-size: 18px;
      line-height: 1.3;
      letter-spacing: .02em;
    }
    .brand-note {
      display: block;
      margin-top: 3px;
      color: var(--ink-faint);
      font-size: 11px;
      line-height: 1.2;
      letter-spacing: .08em;
    }

    .xp-mark {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
      padding: 8px 12px;
      border: 1px solid rgba(47, 81, 68, .12);
      border-radius: 999px;
      color: var(--forest);
      background: rgba(255, 253, 248, .64);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .03em;
    }

    .dayline {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .04em;
    }
    .dayline::before {
      content: "";
      width: 18px;
      height: 1px;
      background: var(--sage);
    }

    .hero-copy {
      margin-bottom: 24px;
    }
    .hero-copy h1 {
      max-width: 620px;
      margin-bottom: 10px;
      font-size: clamp(32px, 8vw, 50px);
      line-height: 1.16;
    }
    .hero-copy p {
      max-width: 520px;
      margin-bottom: 0;
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.75;
    }

    .today-home-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }
    .today-home-head h1 {
      margin-bottom: 0;
      font-size: clamp(26px, 7vw, 39px);
      line-height: 1.38;
    }
    .today-home-head h1 span {
      display: block;
      white-space: nowrap;
    }
    .today-date {
      margin-bottom: 7px;
      color: var(--ink-faint);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .04em;
    }
    .mode-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      min-height: 33px;
      padding: 6px 10px;
      border: 1px solid rgba(91,55,39,.12);
      border-radius: 999px;
      color: var(--forest);
      background: rgba(255,253,248,.65);
      font-size: 11px;
      font-weight: 650;
      white-space: nowrap;
    }
    .simple-task {
      position: relative;
      overflow: hidden;
      padding: 0;
      border: 1px solid rgba(91,55,39,.1);
      border-radius: var(--radius-xl);
      background: rgba(255,253,248,.92);
      box-shadow: var(--shadow-soft);
    }
    .task-hidden { min-height: 0; }
    .task-cover {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      width: 100%;
      min-height: 154px;
      padding: clamp(22px, 5vw, 30px);
      border: 0;
      color: inherit;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .is-main > .task-cover { min-height: 186px; }
    .task-cover:hover { background: rgba(255,255,255,.055); }
    .task-cover:active { background: rgba(0,0,0,.035); }
    .task-cover:focus-visible {
      outline: 3px solid rgba(193,71,38,.3);
      outline-offset: -5px;
    }
    .task-cover-copy {
      display: flex;
      flex: 1;
      min-width: 0;
      flex-direction: column;
    }
    .task-cover-kicker {
      margin-bottom: 8px;
      color: var(--ink-faint);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .12em;
    }
    .is-main .task-cover-kicker {
      color: rgba(255,248,234,.65);
      font-size: 12px;
      letter-spacing: .1em;
    }
    .task-cover-title {
      font-family: var(--serif);
      font-size: clamp(24px, 6vw, 33px);
      font-weight: 800;
      letter-spacing: -.02em;
      line-height: 1.38;
    }
    .is-main .task-cover-title { color: #fffaf0; }
    .task-cover-note {
      margin-top: 6px;
      color: var(--ink-faint);
      font-size: 11px;
    }
    .is-main .task-cover-note { color: rgba(255,248,234,.54); }
    .is-main .task-type-label {
      font-size: 12px;
      letter-spacing: .08em;
    }
    .task-cover-mark {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      border: 1px solid rgba(91,55,39,.16);
      border-radius: 50%;
      color: var(--forest);
      background: rgba(255,243,216,.7);
    }
    .is-main .task-cover-mark {
      color: #fff1cf;
      border-color: rgba(255,255,255,.16);
      background: rgba(255,255,255,.08);
    }
    .task-hidden.is-rolling .task-cover {
      animation: randomCard .3s steps(2, end) infinite;
    }
    .task-hidden.is-rolling .task-cover-mark {
      animation: randomSpin .7s linear infinite;
      color: var(--forest-deep);
      background: var(--sage-soft);
    }
    .roll-dots {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      margin-left: 7px;
      vertical-align: middle;
    }
    .roll-dots i {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
      animation: rollDot .7s ease-in-out infinite;
    }
    .roll-dots i:nth-child(2) { animation-delay: .12s; }
    .roll-dots i:nth-child(3) { animation-delay: .24s; }
    @keyframes randomCard {
      0% { transform: translateX(-2px) rotate(-.18deg); }
      50% { transform: translateX(2px) rotate(.18deg); }
      100% { transform: translateX(-2px) rotate(-.18deg); }
    }
    @keyframes randomSpin { to { transform: rotate(360deg); } }
    @keyframes rollDot {
      0%, 70%, 100% { opacity: .25; transform: translateY(0); }
      35% { opacity: 1; transform: translateY(-3px); }
    }
    .task-body.revealed-content {
      padding-top: clamp(22px, 5vw, 30px);
    }
    .task-body {
      padding: 0 clamp(20px, 4.5vw, 27px) clamp(20px, 4.5vw, 27px);
      animation: taskBodyIn .18s ease both;
    }
    @keyframes taskBodyIn {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .simple-task.is-main {
      color: #fffdf8;
      border-color: transparent;
      background: var(--forest-deep);
      box-shadow: 0 20px 46px rgba(89,55,46,.18);
    }
    .simple-task.is-done { background: var(--sage-soft); }
    .simple-task.is-main.is-done { background: #cf7662; }
    .simple-task-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 15px;
      color: var(--ink-faint);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .is-main .simple-task-head { color: rgba(255,255,255,.62); }
    .simple-task-head span:last-child { letter-spacing: 0; text-transform: none; }
    .simple-task h2 {
      margin-bottom: 7px;
      font-size: clamp(27px, 6.5vw, 38px);
      line-height: 1.35;
    }
    .task-en-title {
      margin: -1px 0 10px;
      color: var(--ink-faint);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .015em;
      line-height: 1.45;
    }
    .is-main .task-en-title { color: rgba(255,248,234,.58); }
    .task-body > p {
      margin-bottom: 17px;
      color: var(--ink-soft);
      font-size: 13px;
      line-height: 1.8;
    }
    .simple-task.is-main .task-body > p { color: rgba(255,255,255,.7); }
    .task-en-desc {
      display: block;
      margin-top: 5px;
      color: var(--ink-faint);
      font-size: 10px;
      line-height: 1.7;
    }
    .is-main .task-en-desc { color: rgba(255,248,234,.5); }
    .simple-task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 19px;
      color: var(--ink-faint);
      font-size: 10px;
    }
    .simple-task-meta span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 8px;
      border-radius: 8px;
      background: var(--surface-soft);
    }
    .is-main .simple-task-meta { color: rgba(255,255,255,.72); }
    .is-main .simple-task-meta span { background: rgba(255,255,255,.075); }
    .simple-task-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .simple-task-actions .btn { min-height: 43px; }
    .simple-task-actions .btn-primary {
      color: var(--forest-deep);
      background: #fff9ea;
    }
    .simple-task-actions .tiny-action {
      min-height: 40px;
      padding: 8px 11px;
      border: 0;
      border-radius: 11px;
      color: rgba(255,255,255,.68);
      background: rgba(255,255,255,.07);
      font-size: 11px;
      cursor: pointer;
    }
    .simple-task-actions .tiny-action:disabled { opacity: .45; }
    .micro-task-head {
      margin: 22px 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .micro-task-head h2 {
      margin-bottom: 0;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .micro-task-head span { color: var(--ink-faint); font-size: 10px; }
    .micro-task-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .micro-task {
      display: block;
      min-height: 0;
      border-color: #d99b8a;
      background: #f7d9d2;
      box-shadow: none;
    }
    .micro-task.is-done {
      border-color: #c47a68;
      background: #f1c6bc;
    }
    .micro-task h3 {
      margin-bottom: 5px;
      font-size: 20px;
      line-height: 1.42;
    }
    .micro-task .task-en-title { margin: -1px 0 8px; font-size: 10px; }
    .micro-task .task-body { padding: 0 18px 18px; }
    .micro-task .task-cover { min-height: 138px; padding: 19px 18px; }
    .micro-task .task-cover-title { font-size: 22px; }
    .micro-task .task-cover-mark { width: 43px; height: 43px; flex-basis: 43px; }
    .micro-task .task-body.revealed-content { padding-top: 19px; }
    .micro-task .task-body > p {
      margin-bottom: 13px;
      font-size: 12px;
    }
    .micro-task .simple-task-meta { margin-bottom: 14px; }
    .micro-task .simple-task-actions { margin-top: auto; }
    .micro-task .simple-task-actions .btn {
      width: 100%;
      color: var(--forest);
      border-color: rgba(91,55,39,.12);
      background: #fff2e8;
    }
    .extra-draw {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 15px 16px;
      margin-top: 14px;
      border: 1px dashed var(--line);
      border-radius: 16px;
      background: rgba(255,245,239,.57);
    }
    .extra-draw div {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .extra-draw strong { font-size: 13px; }
    .extra-draw span { color: var(--ink-faint); font-size: 10px; }
    .extra-draw .btn { flex: 0 0 auto; }
    @media (max-width: 430px) {
      .extra-draw {
        align-items: stretch;
        flex-direction: column;
      }
      .extra-draw .btn { width: 100%; }
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--ink-faint);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .segment {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 4px;
      margin-bottom: 18px;
      border: 1px solid rgba(91,55,39,.1);
      border-radius: 14px;
      background: rgba(255,253,248,.55);
    }
    .segment button {
      min-height: 38px;
      padding: 7px 8px;
      border: 0;
      border-radius: 10px;
      color: var(--ink-soft);
      background: transparent;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
    }
    .segment button.is-active {
      color: #fff;
      background: var(--forest);
      box-shadow: 0 5px 14px rgba(83,45,35,.16);
    }

    .quest-card {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      min-height: 300px;
      padding: clamp(24px, 6vw, 38px);
      border-radius: var(--radius-xl);
      color: #fffdf8;
      background: var(--forest-deep);
      box-shadow: 0 22px 50px rgba(35, 58, 49, .2);
    }
    .quest-card::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 340px;
      height: 340px;
      right: -170px;
      top: -150px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 50%;
      box-shadow: 0 0 0 52px rgba(255,255,255,.025), 0 0 0 105px rgba(255,255,255,.018);
    }
    .quest-card::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 120px;
      height: 1px;
      right: 36px;
      bottom: 34px;
      background: rgba(255,255,255,.16);
      box-shadow: 24px -18px 0 rgba(255,255,255,.08);
    }
    .quest-card.is-done {
      background: #cf7662;
    }
    .quest-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 32px;
      color: rgba(255,255,255,.69);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .07em;
    }
    .quest-index {
      display: inline-flex;
      align-items: center;

      margin-bottom: 5px;
      font-family: var(--serif);
      font-size: 25px;
    }
    .week-stat span { color: var(--ink-soft); font-size: 11px; }

    .suggestion p { margin-bottom: 0; color: rgba(255,255,255,.73); font-size: 13px; }
    .rule-list { display: grid; gap: 0; }
    .rule {

      grid-template-columns: 26px minmax(0, 1fr);
      gap: 10px;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
    }
    .rule:last-child { border-bottom: 0; padding-bottom: 0; }
    .rule:first-child { padding-top: 0; }
    .rule-mark {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      margin-top: 1px;
      border-radius: 50%;
      color: var(--forest);
      background: var(--sage-soft);
      font-size: 11px;
      font-weight: 800;
    }
    .rule p { margin-bottom: 0; font-size: 13px; line-height: 1.6; }
    .rule small { display: block; margin-top: 2px; color: var(--ink-faint); font-size: 11px; }

    .settings-group {
      padding: 0;
      margin: 0 0 13px;
      border: 1px solid rgba(91,55,39,.1);
      border-radius: var(--radius-lg);
      background: rgba(255,253,248,.82);
    }
    .settings-group legend {
      padding: 0 6px;
      margin-left: 13px;
      color: var(--ink-faint);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .13em;
    }
    .settings-body { padding: 9px 18px 17px; }
    .field { display: block; margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }
    .field-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 7px;
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 650;
    }
    .field-label em {
      color: var(--ink-faint);
      font-size: 10px;
      font-style: normal;
      font-weight: 500;
    }
    .control {
      width: 100%;
      min-height: 47px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: var(--surface-soft);
      font-size: 16px;
    }
    textarea.control { min-height: 96px; resize: vertical; line-height: 1.6; }
    select.control {
      appearance: none;
      padding-right: 40px;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%),
        linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%);
      background-position:
        calc(100% - 19px) calc(50% - 2px),
        calc(100% - 14px) calc(50% - 2px);
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    .two-cols {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .choice-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .choice {
      position: relative;
    }
    .choice input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    .choice span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--ink-soft);
      background: var(--surface-soft);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .choice input:checked + span {
      color: var(--forest);
      border-color: rgba(91,55,39,.28);
      background: var(--sage-soft);
      box-shadow: inset 0 0 0 1px rgba(91,55,39,.08);
    }
    .choice input:focus-visible + span {
      outline: 3px solid rgba(91,55,39,.22);
      outline-offset: 2px;
    }
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 54px;
    }
    .switch-copy strong { display: block; margin-bottom: 2px; font-size: 13px; }
    .switch-copy small { display: block; color: var(--ink-faint); font-size: 10px; }
    .switch {
      position: relative;
      width: 54px;
      height: 32px;
      flex: 0 0 54px;
    }
    .switch input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }
    .switch span {
      position: absolute;
      inset: 0;
      border-radius: 99px;
      background: #d9d6cd;
      cursor: pointer;
      transition: background .2s ease;
    }
    .switch span::after {
      content: "";
      position: absolute;
      top: 4px;
      left: 4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 7px rgba(0,0,0,.12);
      transition: transform .2s ease;
    }
    .switch input:checked + span { background: var(--forest); }
    .switch input:checked + span::after { transform: translateX(22px); }
    .switch input:focus-visible + span { outline: 3px solid rgba(91,55,39,.22); outline-offset: 3px; }
    .data-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }
    .data-actions .btn-danger { grid-column: 1 / -1; }
    .settings-primary {
      margin-bottom: 12px;
      border-color: rgba(91,55,39,.16);
      background: var(--sage-soft);
    }
    .settings-primary .field { margin-bottom: 12px; }
    .settings-note {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin: 0;
      color: var(--ink-soft);
      font-size: 11px;
      line-height: 1.55;
    }
    details.settings-advanced {
      padding: 0;
      margin-bottom: 12px;
      border: 1px solid rgba(91,55,39,.1);
      border-radius: var(--radius-lg);
      background: rgba(255,253,248,.82);
    }
    details.settings-advanced > summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 61px;
      padding: 14px 18px;
      list-style: none;
      cursor: pointer;
    }
    details.settings-advanced > summary::-webkit-details-marker { display: none; }
    .settings-summary-title {
      display: block;
      font-size: 14px;
      font-weight: 700;
    }
    .settings-summary-note {
      display: block;
      margin-top: 2px;
      color: var(--ink-faint);
      font-size: 10px;
    }
    .settings-advanced-content { padding: 0 12px 12px; }
    .settings-advanced-content .settings-group {
      margin-bottom: 8px;
      background: var(--surface-soft);
    }
    .privacy-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 20px 8px 4px;
      color: var(--ink-faint);
      font-size: 11px;
      text-align: center;
    }

    .bottom-nav {
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: 0;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      width: min(100%, 760px);
      padding: 8px 10px calc(8px + var(--safe-bottom));
      border: 1px solid rgba(91,55,39,.1);
      border-bottom: 0;
      border-radius: 24px 24px 0 0;
      background: rgba(255,253,248,.94);
      box-shadow: 0 -12px 34px rgba(86,50,28,.08);
      backdrop-filter: blur(18px);
      transform: translateX(-50%);
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-width: 0;
      min-height: 53px;
      padding: 4px 2px;
      border: 0;
      border-radius: 14px;
      color: var(--ink-faint);
      background: transparent;
      cursor: pointer;
    }
    .nav-btn span {
      overflow: hidden;
      max-width: 100%;
      font-size: 10px;
      font-weight: 650;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .nav-btn.is-active {
      color: var(--forest);
      background: var(--sage-soft);
    }
    .nav-btn svg { width: 21px; height: 21px; }

    .wizard-wrap {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 22px clamp(18px, 4vw, 34px) calc(20px + var(--safe-bottom));
    }
    .wizard-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: clamp(26px, 6vw, 45px);
    }
    .wizard-brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 700;
    }
    .wizard-time { color: var(--ink-faint); font-size: 11px; letter-spacing: .04em; }
    .wizard-main {
      flex: 1;
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
    }
    .wizard-copy { margin-bottom: 26px; }
    .wizard-copy h1 {
      margin-bottom: 10px;
      font-size: clamp(32px, 8vw, 48px);
      line-height: 1.18;
    }
    .wizard-copy p { max-width: 520px; margin-bottom: 0; color: var(--ink-soft); font-size: 14px; }
    .preset-list { display: grid; gap: 9px; margin-bottom: 20px; }
    .preset {
      position: relative;
      display: block;
      padding: 18px 48px 18px 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: rgba(255,253,248,.72);
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease;
    }
    .preset:has(input:checked) {
      border-color: rgba(91,55,39,.35);
      background: var(--sage-soft);
      box-shadow: inset 0 0 0 1px rgba(91,55,39,.08);
    }
    .preset input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }
    .preset strong {
      display: block;
      margin-bottom: 4px;
      font-family: var(--serif);
      font-size: 18px;
    }
    .preset span {
      display: block;
      color: var(--ink-soft);
      font-size: 11px;
      line-height: 1.55;
    }
    .preset-en { display: none !important; }
    html[data-language="en"] .preset-zh { display: none; }
    html[data-language="en"] .preset-en { display: block !important; }
    .preset::after {
      content: "";
      position: absolute;
      right: 18px;
      top: 50%;
      width: 19px;
      height: 19px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--surface);
      transform: translateY(-50%);
    }
    .preset:has(input:checked)::after {
      border-color: var(--forest);
      background: var(--forest);
      box-shadow: inset 0 0 0 5px var(--sage-soft);
    }
    .wizard-actions {
      display: flex;
      gap: 9px;
      max-width: 640px;
      width: 100%;
      margin: 32px auto 0;
      padding-top: 18px;
      border-top: 1px solid rgba(91,55,39,.1);
    }
    .wizard-actions .btn-primary { color: #fff; background: var(--forest); }
    .wizard-actions .btn-secondary { flex: 0 0 auto; }
    .wizard-actions .grow { flex: 1; }
    .wizard-actions-simple { margin-top: 22px; }
    .wizard-simple .wizard-copy { margin-bottom: 22px; }
    .wizard-simple .preset { padding-top: 15px; padding-bottom: 15px; }
    .wizard-hint {
      margin: 11px auto 0;
      color: var(--ink-faint);
      font-size: 10px;
      text-align: center;
    }

    .overlay {
      position: fixed;
      z-index: 80;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 16px 16px calc(16px + var(--safe-bottom));
      background: rgba(29,43,37,.34);
      backdrop-filter: blur(4px);
      animation: fadeIn .18s ease both;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .sheet {
      width: min(100%, 580px);
      max-height: min(88vh, 740px);
      overflow-y: auto;
      padding: 24px;
      border-radius: 26px;
      background: var(--surface);
      box-shadow: 0 28px 80px rgba(66,39,28,.24);
      animation: sheetIn .22s ease both;
    }
    @keyframes sheetIn { from { transform: translateY(18px); opacity: .6; } to { transform: translateY(0); opacity: 1; } }
    .sheet-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 19px;
    }
    .sheet-head h2 { margin-bottom: 5px; font-size: 25px; }
    .sheet-head .sheet-en-title {
      margin: -1px 0 6px;
      color: var(--ink-faint);
      font-size: 11px;
      line-height: 1.45;
    }
    .sheet-head p { margin-bottom: 0; color: var(--ink-soft); font-size: 12px; }
    .icon-btn {
      display: grid;
      place-items: center;
      width: 39px;
      height: 39px;
      flex: 0 0 39px;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--ink-soft);
      background: var(--surface-soft);
      cursor: pointer;
    }
    .chip-row { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip {
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink-soft);
      background: var(--surface-soft);
      font-size: 12px;
      cursor: pointer;
    }
    .chip.is-active {
      color: var(--forest);
      border-color: rgba(91,55,39,.27);
      background: var(--sage-soft);
      font-weight: 650;
    }
    .upload-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 58px;
      padding: 11px 13px;
      border: 1px dashed #cfcbbf;
      border-radius: 12px;
      color: var(--ink-soft);
      background: var(--surface-soft);
      font-size: 12px;
      cursor: pointer;
    }
    .upload-box input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }
    .photo-preview {
      width: 100%;
      max-height: 220px;
      margin-top: 9px;
      border-radius: 12px;
      object-fit: cover;
    }
    .sheet-actions {
      display: flex;
      gap: 8px;
      margin-top: 21px;
    }
    .sheet-actions .btn-primary {
      flex: 1;
      color: #fff;
      background: var(--forest);
    }
    .place-choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .place-choice {
      min-height: 50px;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: var(--surface-soft);
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
    }
    .place-choice:hover { background: var(--sage-soft); }

    .toast-wrap {
      position: fixed;
      z-index: 120;
      left: 50%;
      bottom: calc(91px + var(--safe-bottom));
      width: min(calc(100% - 32px), 470px);
      transform: translateX(-50%);
      pointer-events: none;
    }
    .toast {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 13px 16px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px;
      color: #fff;
      background: rgba(83,45,35,.94);
      box-shadow: 0 13px 35px rgba(66,39,28,.2);
      font-size: 12px;
      line-height: 1.5;
      animation: toastIn .2s ease both;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }

    .empty {
      padding: 38px 20px;
      border: 1px dashed #d8d3c8;
      border-radius: var(--radius-lg);
      color: var(--ink-faint);
      background: rgba(255,253,248,.54);
      font-size: 13px;
      text-align: center;
    }
    .empty svg { margin: 0 auto 12px; color: var(--sage); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @media (min-width: 680px) {
      .bottom-nav {
        bottom: 16px;
        border-bottom: 1px solid rgba(91,55,39,.1);
        border-radius: 24px;
        padding-bottom: 8px;
      }
      .page { padding-bottom: 130px; }
      .anchor-card { min-height: 195px; }
      .quest-card { min-height: 330px; }
      .stat-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .place-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    @media (max-width: 430px) {
      .anchor-grid { grid-template-columns: 1fr; }
      .anchor-card { min-height: 0; }
      .anchor-label { margin-bottom: 14px; }
      .micro-task-grid { grid-template-columns: 1fr; }
      .two-cols { grid-template-columns: 1fr; }
      .task-chips { grid-template-columns: 1fr; }
      .quest-card { min-height: 0; }
      .quest-actions .btn, .quest-actions .done-badge { width: 100%; }
      .today-home-head { align-items: flex-start; }
      .simple-task-actions .btn { flex: 1; }
      .bottom-nav { border-radius: 20px 20px 0 0; padding-inline: 6px; }
    }
  </style>
</head>

    function parseTask(line) {
      const [id, name, desc, minuteText, completion, category, scene, social, body] = line.split('|');
      const bounds = minuteText.split('-').map(Number);
      return {
        id, name, desc, minutes: minuteText, completion, category, scene, social, body,
        minMinutes: Math.min(...bounds),
        maxMinutes: Math.max(...bounds),
        xp: id.startsWith('I') ? 15 : id.startsWith('M') ? 5 : id.startsWith('K') ? 24 : id.startsWith('R') ? 12 : 10,
        isAnchor: id.startsWith('M')
      };
    }

    const TASKS = TASK_SOURCE.trim().split(/\r?\n/).filter(Boolean).map(parseTask).map(t => {
      const copy = TASK_COPY[t.id];
      return copy ? {
        ...t,
        name: copy[0],
        enName: copy[1],
        desc: copy[2],
        enDesc: copy[3]
      } : { ...t, enName: t.name, enDesc: t.desc };
    });
    const MAIN_TASKS = TASKS.filter(t => !t.isAnchor);
    const ANCHOR_TASKS = TASKS.filter(t => t.isAnchor);
    const TASK_BY_ID = Object.fromEntries(TASKS.map(t => [t.id, t]));

    const dateKey = (date = new Date()) => {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };
    const parseDateKey = key => {
      const [y, m, d] = key.split('-').map(Number);
      return new Date(y, m - 1, d, 12);
    };
    const addDays = (key, amount) => {
      const d = parseDateKey(key);
      d.setDate(d.getDate() + amount);
      return dateKey(d);
    };
    const dayDistance = (from, to) => Math.round((parseDateKey(to) - parseDateKey(from)) / 86400000);
    const getWeekKey = (date = new Date()) => {
      const d = new Date(date);
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
      const firstThursday = new Date(d.getFullYear(), 0, 4);
      return `${d.getFullYear()}-W${String(1 + Math.round(((d - firstThursday) / 86400000 - 3 + ((firstThursday.getDay() + 6) % 7)) / 7)).padStart(2, '0')}`;
    };
    const weekDates = (date = new Date()) => {
      const d = new Date(date);
      d.setHours(12, 0, 0, 0);
      const offset = (d.getDay() + 6) % 7;
      d.setDate(d.getDate() - offset);
      return Array.from({ length: 7 }, (_, i) => {
        const x = new Date(d);
        x.setDate(d.getDate() + i);
        return dateKey(x);
      });
    };
    const defaultDayType = (date = new Date()) => [0, 6].includes(date.getDay()) ? '休息日' : '工作日';
    const dayTypeLabel = type => type === '工作日' ? '工作日 / 学习日' : type;

    function createInitialState() {
      return {
        version: 1,
        initialized: true,
        profile: normalizeProfile(),
        settings: {
          photoEnabled: true,
          dayType: defaultDayType(),
          language: 'zh'
        },
        tasks: TASKS,
        dailyAssignment: null,
        history: {},
        records: [],
        collection: { unlockedTaskIds: [], unlockDates: {} },
        map: { litPlaceTypes: Object.fromEntries(PLACES.map(p => [p, 0])) },
        weekI: { weekKey: getWeekKey(), count: 0 }
      };
    }

    let state = createInitialState();
    const ui = {
      page: 'today',
      revealedTaskIds: new Set(),
      rollingTaskId: null,
      rollTimer: null,
      calendarMonth: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
      selectedRecordDate: dateKey(),
      moreTab: 'weekly',
      completion: { taskId: null, quickPhrase: '', note: '', photo: '' },
      locationTaskId: null,
      clearArmed: false,
      toastTimer: null
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return createInitialState();
        const saved = JSON.parse(raw);
        const base = createInitialState();
        return {
          ...base,
          ...saved,
          initialized: true,
          profile: normalizeProfile(saved.profile),
          settings: {
            ...base.settings,
            ...(saved.settings || {}),
            language: saved.settings?.language === 'en' ? 'en' : 'zh'
          },
          tasks: TASKS,
          dailyAssignment: saved.dailyAssignment || null,
          history: saved.history || {},
          records: Array.isArray(saved.records) ? saved.records : [],
          collection: {
            unlockedTaskIds: Array.isArray(saved.collection?.unlockedTaskIds) ? saved.collection.unlockedTaskIds : [],
            unlockDates: saved.collection?.unlockDates || {}
          },
          map: {
            litPlaceTypes: {
              ...Object.fromEntries(PLACES.map(p => [p, 0])),
              ...(saved.map?.litPlaceTypes || {})
            }
          },
          weekI: { weekKey: getWeekKey(), count: 0, ...(saved.weekI || {}) }
        };
      } catch (error) {
        console.error('读取本机数据时遇到问题', error);
        return createInitialState();
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function escapeHTML(value = '') {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[char]));
    }

    function translateUiText(rawText) {
      const text = rawText.trim();
      if (!text) return '';
      if (UI_TRANSLATIONS[text]) return UI_TRANSLATIONS[text];
      if (CATEGORY_EN[text]) return CATEGORY_EN[text];
      if (PLACE_EN[text]) return PLACE_EN[text];
      if (PRESET_EN[text]) return PRESET_EN[text];
      const weekdays = { '一': 'Mon', '二': 'Tue', '三': 'Wed', '四': 'Thu', '五': 'Fri', '六': 'Sat', '日': 'Sun' };
      if (weekdays[text]) return weekdays[text];
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      let match;
      if ((match = text.match(/^(\d{4})年(\d{1,2})月(\d{1,2})日 · 周(.)$/))) {
        return `${months[Number(match[2]) - 1]} ${match[3]}, ${match[1]} · ${weekdays[match[4]]}`;
      }
      if ((match = text.match(/^(\d{1,2})月(\d{1,2})日 · 周(.)$/))) {
        return `${months[Number(match[1]) - 1]} ${match[2]} · ${weekdays[match[3]]}`;
      }
      if ((match = text.match(/^(\d{4})年(\d{1,2})月$/))) {
        return `${months[Number(match[2]) - 1]} ${match[1]}`;
      }
      if ((match = text.match(/^(\d{4})-W(\d{2}) · 本周回声$/))) {
        return `Week ${match[2]} · This week`;
      }
      if ((match = text.match(/^完成 (\d+) 项$/))) return `${match[1]} completed`;
      if ((match = text.match(/^(\d+) 天有记录 · 完成 (\d+) 项$/))) return `${match[1]} days with records · ${match[2]} completed`;
      if ((match = text.match(/^(\d+) 分钟$/))) return `${match[1]} min`;
      if ((match = text.match(/^(\d+) 次记录$/))) return `${match[1]} records`;
      if ((match = text.match(/^(\d+) \/ (\d+) 天$/))) return `${match[1]} / ${match[2]} days`;
      if ((match = text.match(/^已点亮 (\d+) 种 · 共 (\d+) 次$/))) return `${match[1]} types lit · ${match[2]} visits`;
      if ((match = text.match(/^已收集 (\d+) \/ (\d+)$/))) return `${match[1]} of ${match[2]} collected`;
      if ((match = text.match(/^加抽任务 · (\d+)$/))) return `Extra tasks · ${match[1]}`;
      if ((match = text.match(/^小任务 (\d+)$/))) return `Side task ${match[1]}`;
      if ((match = text.match(/^加抽任务 (\d+)$/))) return `Extra task ${match[1]}`;
      if ((match = text.match(/^(?:主线任务|主任务)(?: · (.+))?$/))) {
        return `Main quest${match[1] ? ` · ${match[1] === '已完成' ? 'Completed' : (CATEGORY_EN[match[1]] || match[1])}` : ''}`;
      }
      if ((match = text.match(/^(小任务|加抽任务) (\d+)(?: · 已完成)?$/))) return `${match[1] === '小任务' ? 'Side task' : 'Extra task'} ${match[2]}${text.includes('已完成') ? ' · Completed' : ''}`;
      if ((match = text.match(/^(\d{4}-\d{2}-\d{2}) 解锁$/))) return `Unlocked ${match[1]}`;
      if ((match = text.match(/^已完成 \+(\d+)$/))) return `Completed +${match[1]}`;
      if ((match = text.match(/^数据只存本机，不上传。当前共 (\d+) 条记录。$/))) return `Stored only on this device. ${match[1]} records.`;
      return '';
    }

    function applyBilingualText(root) {
      if (!root) return;
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) {
        const node = walker.currentNode;
        if (!node.nodeValue.trim()) continue;
        if (node.parentElement?.closest('.bi-en,.task-en-title,.task-en-desc,.record-en,.task-en-mini,.brand-name,.brand-note,script,style,option')) continue;
        if (translateUiText(node.nodeValue)) nodes.push(node);
      }
      nodes.forEach(node => {
        const english = translateUiText(node.nodeValue);
        if (!english) return;
        const chinese = document.createElement('span');
        chinese.className = 'bi-zh';
        chinese.textContent = node.nodeValue.trim();
        const span = document.createElement('span');
        span.className = 'bi-en';
        span.setAttribute('aria-hidden', 'true');
        span.textContent = english;
        node.parentNode.replaceChild(chinese, node);
        chinese.parentNode.insertBefore(span, chinese.nextSibling);
      });
    }

    function applyLanguage() {
      const language = ['zh', 'en'].includes(state.settings.language)
        ? state.settings.language
        : 'zh';
      if (state.settings.language !== language) {
        state.settings.language = language;
        try { saveState(); } catch (error) { console.error(error); }
      }
      state.settings.language = language;
      document.documentElement.dataset.language = language;
      document.documentElement.lang = language === 'en' ? 'en' : 'zh-CN';
    }

    function showToast(message, duration = 2600) {
      const wrap = document.getElementById('toast-wrap');
      if (!wrap) return;
      wrap.innerHTML = `<div class="toast">${icon('spark', 18)}<span>${escapeHTML(message)}</span></div>`;
      applyBilingualText(wrap);
      applyLanguage();
      clearTimeout(ui.toastTimer);
      ui.toastTimer = setTimeout(() => { wrap.innerHTML = ''; }, duration);
    }

    function task(id) {
      return TASK_BY_ID[id] || { id, name: '未知任务', desc: '', minutes: '', completion: '', category: '', xp: 0 };
    }

    function availableMinutes(dayType = state.settings.dayType) {
      const candidate = dayType === '休息日' ? Number(state.profile.restMinutes) : Number(state.profile.workMinutes);
      if (dayType === '休息日') return Math.max(150, candidate || 60);
      return Math.max(1, candidate || 15);
    }

    function mainCompletedToday() {
      const d = state.dailyAssignment;
      return Boolean(d && (d.completedTaskIds || []).includes(d.mainTaskId));
    }

    function completedIdsToday() {
      return new Set(state.dailyAssignment?.completedTaskIds || []);
    }

    function totalXP() {
      return state.records.reduce((sum, record) => sum + Number(record.xp || 0), 0);
    }

    function syncHistoryEntry(assignment = state.dailyAssignment) {
      if (!assignment?.date) return;
      const prior = state.history[assignment.date] || {};
      const completed = new Set([...(assignment.completedTaskIds || []), ...(prior.completedTaskIds || [])]);
      state.history[assignment.date] = {
        date: assignment.date,
        dayType: assignment.dayType,
        mainTaskId: assignment.mainTaskId,
        completedMain: prior.completedMain || completed.has(assignment.mainTaskId),
        completedTaskIds: Array.from(completed)
      };
    }

    function hasMainDoneOn(key) {
      if (state.history[key]?.completedMain) return true;
      return state.records.some(record => record.date === key && record.done && !record.taskId.startsWith('M'));
    }

    function consecutiveBreakForced() {
      if (!state.profile.createdDate || dayDistance(state.profile.createdDate, dateKey()) < 3) return false;
      return [1, 2, 3].every(offset => !hasMainDoneOn(addDays(dateKey(), -offset)));
    }

    function transportAllows(t) {
      const prefix = t.id[0];
      if (!['G', 'I'].includes(prefix)) return true;
      const transport = state.profile.transport;
      const walking = ['G2', 'G3', 'G5', 'G9', 'G10', 'I1', 'I7', 'I8', 'I9'];
      const bus = [...walking, 'G1', 'G4', 'G8', 'I5'];
      const car = [...walking, 'G1', 'G4', 'G7', 'G8', 'I2', 'I3', 'I4'];
      if (transport === '公交') return bus.includes(t.id);
      if (transport === '自驾') return car.includes(t.id);
      return walking.includes(t.id);
    }

    function eligibleMainTasks({ isLow = false, reroll = false, gapForced = false } = {}) {
      const minutes = availableMinutes(state.settings.dayType);
      const allowedF = new Set(['F1', 'F2', 'F5', 'F7', 'F10']);
      const seen = new Set(state.dailyAssignment?.seenMainIds || []);
      const skipped = new Set(state.dailyAssignment?.skippedMainIds || []);
      if (reroll) {
        seen.clear();
        if (state.dailyAssignment?.mainTaskId) seen.add(state.dailyAssignment.mainTaskId);
      }
      return MAIN_TASKS.filter(t => {
        if (t.maxMinutes > minutes) return false;
        if (skipped.has(t.id)) return false;
        if (seen.has(t.id)) return false;
        if (gapForced || isLow) return t.category === '低电量';
        const prefix = t.id[0];
        if (state.profile.preset === '随机') {
          if (prefix === 'I' && getWeekKey() === state.weekI.weekKey && state.weekI.count >= 1) return false;
          if (state.settings.dayType === '工作日' && ['G', 'I', 'J', 'K'].includes(prefix)) return false;
          return true;
        }
        if (state.settings.dayType === '工作日' && ['G', 'I', 'J', 'K'].includes(prefix)) return false;
        if (state.profile.movement === '很低' && t.id === 'D5') return false;
        if (state.profile.social === '独处恢复' && prefix === 'F' && !allowedF.has(t.id)) return false;
        if (state.profile.social === '独处恢复' && prefix === 'I' && t.social === '熟人可选') return false;
        if (state.profile.social === '独处恢复' && t.id === 'G7' && state.settings.dayType === '工作日') return false;
        if (!transportAllows(t)) return false;
        if (prefix === 'I' && getWeekKey() === state.weekI.weekKey && state.weekI.count >= 1) return false;
        return true;
      });
    }

    function weightForTask(t) {
      let weight = 1;
      if (state.profile.preset === '随机') {
        if (state.settings.dayType === '休息日' && t.id[0] === 'K') weight *= 18;
        if (state.settings.dayType === '休息日' && t.id[0] !== 'K' && t.minMinutes >= 30) weight *= 4;
      if (state.settings.dayType === '休息日' && t.id[0] !== 'K' && t.minMinutes < 30) weight *= .35;
        if (state.settings.dayType === '休息日' && ['G', 'I', 'J'].includes(t.id[0])) weight *= 1.85;
        return weight;
      }
      if (Array.isArray(state.profile.preferences) && state.profile.preferences.includes(t.category)) weight *= 2;
      if (state.settings.dayType === '休息日' && t.id[0] === 'K') weight *= 18;
      if (state.settings.dayType === '休息日' && t.id[0] !== 'K' && t.minMinutes >= 30) weight *= 4;
        if (state.settings.dayType === '休息日' && t.id[0] !== 'K' && t.minMinutes < 30) weight *= .35;
      if (state.settings.dayType === '休息日' && ['G', 'I', 'J'].includes(t.id[0])) weight *= 1.85;
      if (state.settings.dayType === '休息日' && state.profile.outing === '低' && t.social === '零社交') weight *= 1.25;
      if (state.profile.movement === '只接受走路' && t.body === '走路') weight *= 1.45;
      if (state.profile.social === '独处恢复' && t.category === '线上社交') weight *= .8;
      return weight;
    }

    function weightedPick(items) {
      if (!items.length) return null;
      const weights = items.map(weightForTask);
      const total = weights.reduce((a, b) => a + b, 0);
      let cursor = Math.random() * total;
      for (let i = 0; i < items.length; i += 1) {
        cursor -= weights[i];
        if (cursor <= 0) return items[i];
      }
      return items[items.length - 1];
    }

    function chooseMainTask({ reroll = false } = {}) {
      const low = state.settings.dayType === '低电量日';
      const forced = consecutiveBreakForced();
      let pool = eligibleMainTasks({ isLow: low, reroll, gapForced: forced });
      if (!pool.length && reroll) {
        state.dailyAssignment.skippedMainIds = [];
        pool = eligibleMainTasks({ isLow: low, reroll, gapForced: forced });
      }
      if (!pool.length) {
        pool = MAIN_TASKS.filter(t => t.maxMinutes <= availableMinutes()
          && (state.settings.dayType !== '工作日' || t.id[0] !== 'K')
          && (!low && !forced || t.category === '低电量'));
      }
      if (!pool.length) pool = MAIN_TASKS.filter(t => t.category === '低电量');
      return { picked: weightedPick(pool), forced };
    }

    function chooseAnchors() {
      const pool = [...ANCHOR_TASKS];
      const result = [];
      while (result.length < 2 && pool.length) {
        const index = Math.floor(Math.random() * pool.length);
        result.push(pool.splice(index, 1)[0]);
      }
      return result;
    }

    function chooseExtraTask() {
      const minutes = availableMinutes();
      const active = new Set([
        state.dailyAssignment?.mainTaskId,
        ...(state.dailyAssignment?.anchorIds || []),
        ...(state.dailyAssignment?.extraTaskIds || [])
      ].filter(Boolean));
      const allowedF = new Set(['F1', 'F2', 'F5', 'F7', 'F10']);
      const eligible = TASKS.filter(t => {
        if (t.maxMinutes > minutes) return false;
        if (state.settings.dayType === '低电量日') return t.category === '低电量';
        const prefix = t.id[0];
        if (state.profile.preset === '随机') {
          if (state.settings.dayType === '工作日' && ['G', 'I', 'J', 'K'].includes(prefix)) return false;
          if (prefix === 'I' && getWeekKey() === state.weekI.weekKey && state.weekI.count >= 1) return false;
          return true;
        }
        if (state.settings.dayType === '工作日' && ['G', 'I', 'J', 'K'].includes(prefix)) return false;
        if (state.profile.movement === '很低' && t.id === 'D5') return false;
        if (state.profile.social === '独处恢复' && prefix === 'F' && !allowedF.has(t.id)) return false;
        if (state.profile.social === '独处恢复' && prefix === 'I' && t.social === '熟人可选') return false;
        if (prefix === 'I' && getWeekKey() === state.weekI.weekKey && state.weekI.count >= 1) return false;
        return transportAllows(t);
      });
      const unseen = eligible.filter(t => !active.has(t.id));
      return weightedPick(unseen.length ? unseen : eligible);
    }

    function buildAssignment({ preserveAnchors = false } = {}) {
      state.settings.dayType = DAY_TYPES.includes(state.settings.dayType) ? state.settings.dayType : defaultDayType();
      const result = chooseMainTask();
      if (!result.picked) return false;
      const previousSeen = state.dailyAssignment?.date === dateKey() ? (state.dailyAssignment.seenMainIds || []) : [];
      const previousAnchors = state.dailyAssignment?.date === dateKey() ? state.dailyAssignment.anchorIds : null;
      const previousExtras = state.dailyAssignment?.date === dateKey() ? (state.dailyAssignment.extraTaskIds || []) : [];
      const chosenAnchors = preserveAnchors && previousAnchors?.length === 2
        ? previousAnchors
        : chooseAnchors().map(t => t.id);
      state.dailyAssignment = {
        date: dateKey(),
        dayType: state.settings.dayType,
        mainTaskId: result.picked.id,
        anchorIds: chosenAnchors,
        skippedMainIds: preserveAnchors ? (state.dailyAssignment?.skippedMainIds || []) : [],
        rerollUsed: preserveAnchors ? Boolean(state.dailyAssignment?.rerollUsed) : false,
        status: 'pending',
        completedTaskIds: preserveAnchors ? (state.dailyAssignment?.completedTaskIds || []) : [],
        extraTaskIds: preserveAnchors ? previousExtras : [],
        seenMainIds: Array.from(new Set([...previousSeen, result.picked.id])),
        gapForced: result.forced
      };
      if (getWeekKey() !== state.weekI.weekKey) state.weekI = { weekKey: getWeekKey(), count: 0 };
      if (result.picked.id.startsWith('I')) {
        state.weekI.count = Number(state.weekI.count || 0) + 1;
      }
      syncHistoryEntry();
      return true;
    }

    function ensureToday() {
      if (!state.initialized) return;
      const currentDate = dateKey();
      if (getWeekKey() !== state.weekI.weekKey) state.weekI = { weekKey: getWeekKey(), count: 0 };
      if (state.dailyAssignment?.date === currentDate) {
        const scheduledType = defaultDayType();
        if (state.settings.dayType !== scheduledType || state.dailyAssignment.dayType !== scheduledType) {
          state.settings.dayType = scheduledType;
          state.dailyAssignment.dayType = scheduledType;
          if (!mainCompletedToday()) regenerateForSettings();
          syncHistoryEntry();
          try { saveState(); } catch (error) { console.error(error); }
        }
        return;
      }
      if (state.dailyAssignment?.date) syncHistoryEntry();
      state.settings.dayType = defaultDayType();
      buildAssignment();
      try { saveState(); } catch (error) { console.error(error); }
    }

    function formatDate(key, withYear = false) {
      const d = parseDateKey(key);
      return `${withYear ? `${d.getFullYear()}年` : ''}${d.getMonth() + 1}月${d.getDate()}日`;
    }

    function weekdayName(key) {
      return ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][parseDateKey(key).getDay()];
    }

    const NAV_ITEMS = [
      ['today', '今日', 'home'],
      ['records', '记录', 'book'],
      ['collection', '图鉴', 'spark'],
      ['map', '足迹', 'map'],
      ['more', '更多', 'chart']
    ];

    function topbar() {
      return `
        <header class="topbar">
          <div class="brand">
            <div class="brand-mark"><img class="brand-avatar" src="${SHARK_ICON}" alt=""></div>
            <div class="brand-copy">
              <span class="brand-name">i人小副本</span>
              <span class="brand-note">Solo Side Quest</span>
            </div>
          </div>
          <div class="xp-mark">${icon('spark', 15)}<span>${totalXP()} XP</span></div>
        </header>`;
    }

    function bottomNav() {
      return `
        <nav class="bottom-nav" aria-label="主要页面">
          ${NAV_ITEMS.map(([id, label, iconName]) => `
            <button class="nav-btn ${ui.page === id ? 'is-active' : ''}" data-action="navigate" data-page="${id}" aria-current="${ui.page === id ? 'page' : 'false'}">
              ${icon(iconName, 21)}
              <span>${label}</span>
            </button>`).join('')}
        </nav>`;
    }

    function layout(content, options = {}) {
      const noNav = options.noNav;
      return `
        <div class="${options.wizard ? 'wizard-wrap' : 'page'}">
          ${noNav ? '' : topbar()}
          ${content}
        </div>
        ${noNav ? '' : bottomNav()}
        ${renderCompletionSheet()}
        ${renderLocationSheet()}`;
    }

    function todayView() {
      if (!state.dailyAssignment) {
        buildAssignment();
        try { saveState(); } catch (error) { console.error(error); }
      }
      const assignment = state.dailyAssignment;
      const mainTask = task(assignment.mainTaskId);
      const done = completedIdsToday();
      const extraTaskIds = Array.isArray(assignment.extraTaskIds) ? assignment.extraTaskIds : [];
      const mainDone = done.has(mainTask.id);
      const gapMessage = assignment.gapForced || assignment.dayType === '低电量日'
        ? `<div class="notice">${icon('moon', 19)}<span>低电量降级，仍然算今天有照顾自己。做一个小动作就很好。</span></div>`
        : '';
      return layout(`
        <section class="today-home-head">
          <div>
            <div class="today-date">${formatDate(assignment.date)} · ${weekdayName(assignment.date)}</div>
            <h1><span>今天做点啥呢？</span><span>抽个任务吧</span></h1>
          </div>
          <span class="mode-chip">${icon('spark', 13)} ${dayTypeLabel(assignment.dayType)}</span>
        </section>
        ${gapMessage}
        ${ui.revealedTaskIds.has(mainTask.id) ? `
          <article class="simple-task is-main ${mainDone ? 'is-done' : ''}" id="task-card-${mainTask.id}" tabindex="-1" aria-labelledby="main-task-title">
            <div class="task-body revealed-content">
              <div class="simple-task-head">
                <span class="task-type-label">主线任务 · ${mainTask.category}</span>
                <span>${mainDone ? '已完成' : `+${mainTask.xp} XP`}</span>
              </div>
              <h2 id="main-task-title"><span class="task-zh-title">${escapeHTML(mainTask.name)}</span><span class="task-en-title">${escapeHTML(mainTask.enName)}</span></h2>
              <p><span class="task-zh-desc">${escapeHTML(mainTask.desc)}</span><span class="task-en-desc">${escapeHTML(mainTask.enDesc)}</span></p>
              <div class="simple-task-meta">
                <span>${icon('clock', 12)} ${mainTask.minutes} 分钟</span>
                <span>${mainTask.completion}</span>
              </div>
              <div class="simple-task-actions">
                ${mainDone
                  ? `<span class="done-badge">${icon('check', 18)} 已完成，今天这里收好</span>`
                  : `<button class="btn btn-primary" data-action="open-complete" data-task-id="${mainTask.id}">${icon('check', 18)} 做完了</button>`}
                ${mainDone
                  ? ''
                  : `<button class="tiny-action" data-action="reroll">${icon('refresh', 15)} 换一个</button>
                     <button class="tiny-action" data-action="skip-main">当前做不了</button>`}
              </div>
            </div>
          </article>` : `
          <article class="simple-task is-main task-hidden ${mainDone ? 'is-done' : ''} ${ui.rollingTaskId === mainTask.id ? 'is-rolling' : ''}" aria-busy="${ui.rollingTaskId === mainTask.id}">
            <button class="task-cover" data-action="reveal-task" data-task-id="${mainTask.id}" aria-label="揭晓主线任务">
              <span class="task-cover-copy">
                <span class="task-cover-kicker">主线任务${mainDone ? ' · 已完成' : ''}</span>
                <span class="task-cover-title">${ui.rollingTaskId === mainTask.id ? '正在随机翻牌' : '点一下，看看今天做什么'}</span>
                ${ui.rollingTaskId === mainTask.id ? '<span class="task-cover-note">从任务池里抽一张<span class="roll-dots" aria-hidden="true"><i></i><i></i><i></i></span></span>' : ''}
              </span>
              <span class="task-cover-mark">${icon(ui.rollingTaskId === mainTask.id ? 'refresh' : 'spark', 23)}</span>
            </button>
          </article>`}
        <div class="micro-task-head">
          <h2>随机小任务</h2>
          <span>两个里挑一个也行</span>
        </div>
        <section class="micro-task-grid">
          ${assignment.anchorIds.map((id, index) => {
            const t = task(id);
            const isDone = done.has(id);
            return `
              ${ui.revealedTaskIds.has(t.id) ? `
                <article class="simple-task micro-task ${isDone ? 'is-done' : ''}" id="task-card-${t.id}" tabindex="-1">
                  <div class="task-body revealed-content">
                    <div class="simple-task-head">
                      <span>小任务 0${index + 1}</span>

    function recordsView() {
      const year = ui.calendarMonth.getFullYear();
      const month = ui.calendarMonth.getMonth();
      const monthStart = new Date(year, month, 1);
      const startOffset = (monthStart.getDay() + 6) % 7;
      const calendarStart = new Date(year, month, 1 - startOffset);
      const cells = Array.from({ length: 42 }, (_, index) => {
        const date = new Date(calendarStart.getFullYear(), calendarStart.getMonth(), calendarStart.getDate() + index);
        const key = dateKey(date);
        const records = state.records.filter(record => record.date === key && record.done);
        return { date, key, records, inMonth: date.getMonth() === month };
      });
      const monthRecords = state.records.filter(record => {
        const date = parseDateKey(record.date);
        return record.done && date.getFullYear() === year && date.getMonth() === month;
      });
      const completedDays = new Set(monthRecords.map(record => record.date));
      const selectedDate = ui.selectedRecordDate || dateKey();
      const selectedRecords = state.records
        .filter(record => record.date === selectedDate && record.done)
        .sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
      return layout(`
        <p class="eyebrow">${year} · ${String(month + 1).padStart(2, '0')}</p>
        <section class="calendar-card">
          <div class="calendar-head">
            <button class="calendar-nav" data-action="calendar-prev" aria-label="上个月">${icon('chevron', 18)}</button>
            <div>
              <h2>${year}年${month + 1}月</h2>
              <p>${completedDays.size} 天有记录 · 完成 ${monthRecords.length} 项</p>
            </div>
            <button class="calendar-nav calendar-next" data-action="calendar-next" aria-label="下个月">${icon('chevron', 18)}</button>
          </div>
          <div class="calendar-weekdays" aria-hidden="true">
            ${['一', '二', '三', '四', '五', '六', '日'].map(day => `<span>${day}</span>`).join('')}
          </div>
          <div class="calendar-grid">
            ${cells.map(cell => {
              const classes = [
                'calendar-day',
                cell.inMonth ? '' : 'is-outside',
                cell.records.length ? 'has-records' : '',
                cell.key === dateKey() ? 'is-today' : '',
                cell.key === selectedDate ? 'is-selected' : ''
              ].filter(Boolean).join(' ');
              return `<button class="${classes}" data-action="select-record-date" data-date="${cell.key}" data-count="${cell.records.length}" aria-label="${formatDate(cell.key)}${cell.records.length ? `，完成 ${cell.records.length} 项` : '，暂无记录'}" aria-pressed="${cell.key === selectedDate}">
                <span>${cell.date.getDate()}</span>
                ${cell.records.length ? `<i class="calendar-count">${cell.records.length}</i>` : ''}
              </button>`;
            }).join('')}
          </div>
          <div class="calendar-footer">
            <span class="calendar-legend"><i></i> 高亮日期已完成任务</span>
            <button class="calendar-today" data-action="calendar-today">回到今天</button>
          </div>
        </section>
        <div class="selected-day-head">
          <div>
            <p class="eyebrow">${formatDate(selectedDate, true)} · ${weekdayName(selectedDate)}</p>
            <h2>${selectedRecords.length ? `完成 ${selectedRecords.length} 项` : '这天还没有记录'}</h2>
          </div>
        </div>
        ${selectedRecords.length ? `
          <div class="record-list">
            ${selectedRecords.map(record => {
              const t = task(record.taskId);
              return `
                <article class="record">
                  <div class="record-date"><strong>${String(parseDateKey(record.date).getDate()).padStart(2, '0')}</strong>${parseDateKey(record.date).getMonth() + 1}月<br>${weekdayName(record.date)}</div>
                  <div>
                    <div class="record-head">
                      <div>
                        <h3><span class="task-zh-title">${escapeHTML(t.name)}</span></h3>
                        <span class="record-en">${escapeHTML(t.enName)}</span>
                        <span class="faint small">${record.kind === 'extra' ? '加抽任务' : (record.kind === 'anchor' || record.taskId.startsWith('M')) ? '随机小任务' : '主线任务'} · ${escapeHTML(t.category)}</span>
                      </div>
                      <span class="record-phrase">已完成 +${record.xp}</span>
                    </div>
                    ${record.quickPhrase ? `<span class="record-phrase" style="margin-top:8px">${escapeHTML(record.quickPhrase)}</span>` : ''}
                    ${record.note ? `<p class="record-note">${escapeHTML(record.note)}</p>` : ''}
                    ${record.photo ? `<img class="record-photo" src="${record.photo}" alt="${escapeHTML(t.name)}的记录照片" loading="lazy">` : ''}
                  </div>
                </article>`;
            }).join('')}
          </div>` : `
          <div class="empty">${icon('feather', 28)}<br>这一天还没有完成记录。没有补签，过好今天就好。</div>`}

    function weeklyContent() {
      const dates = weekDates();
      const today = dateKey();
      const currentRecords = state.records.filter(r => r.done && dates.includes(r.date));
      const completedMainDates = new Set(currentRecords.filter(r => !r.taskId.startsWith('M')).map(r => r.date));
      const mainDoneCount = currentRecords.filter(r => !r.taskId.startsWith('M')).length;
      const outgoingCount = currentRecords.filter(r => ['出门', '隐藏挑战'].includes(task(r.taskId).category)).length;
      const anchorDays = new Set(currentRecords.filter(r => r.taskId.startsWith('M')).map(r => r.date)).size;
      const weekXP = currentRecords.reduce((sum, r) => sum + Number(r.xp || 0), 0);
      const elapsed = dates.filter(d => d <= today);
      let maxGap = 0;
      let running = 0;
      elapsed.forEach(d => {
        if (completedMainDates.has(d)) running = 0;
        else {
          running += 1;
          maxGap = Math.max(maxGap, running);
        }
      });
      const suggestions = [];
      if (completedMainDates.size >= 3 && anchorDays >= 5) suggestions.push('这周的节奏已经很稳。下周可以保留大部分设置，只把最顺手的一项再缩小一点。');
      else if (maxGap >= 3) suggestions.push('断档不补，明天继续。下一周把主线任务缩到 5 分钟也可以，小一点更容易回来。');
      else if (completedMainDates.size >= 3) suggestions.push('主线已经有三次回声。微锚点不用凑满，挑起床后或睡前固定一个会更轻松。');
      else suggestions.push('这周先照顾电量。下次只挑一个最不费力的微锚点，把它放在固定的日常动作旁边。');
      return `
        <p class="eyebrow">${getWeekKey()} · 本周回声</p>
        <h1 class="page-title">这一周我做完了这些任务，太棒了</h1>
        <p class="page-lead">下周要不要改一个节奏呢？</p>
        <div class="week-stats">
          <div class="week-stat"><strong>${completedMainDates.size}</strong><span>主线任务完成天数</span></div>
          <div class="week-stat"><strong>${mainDoneCount}</strong><span>主线任务完成数</span></div>
          <div class="week-stat"><strong>${outgoingCount}</strong><span>出门任务完成数</span></div>
          <div class="week-stat"><strong>${anchorDays}</strong><span>微锚点完成天数</span></div>
          <div class="week-stat"><strong>${maxGap}</strong><span>最大连续断档天数</span></div>
          <div class="week-stat"><strong>${weekXP}</strong><span>本周 XP</span></div>
        </div>
        <section class="suggestion">
          <h3>给下周的一句话</h3>
          <p>${suggestions[0]}</p>
        </section>
        <section class="card">
          <div class="section-heading" style="margin:0 0 16px"><div><h2 style="font-size:20px">周锚点</h2><p>方向在这里，不当作考核</p></div></div>
          <div class="rule-list">
            <div class="rule"><span class="rule-mark">01</span><div><p>每周至少 3 天主线任务</p><small>${completedMainDates.size} / 3 天</small></div></div>
            <div class="rule"><span class="rule-mark">02</span><div><p>工作日在家任务每周至少 2 次</p><small>${currentRecords.filter(r => { const weekday = parseDateKey(r.date).getDay(); return r.taskId[0] !== 'M' && weekday >= 1 && weekday <= 5 && task(r.taskId).scene === '在家'; }).length} 次记录</small></div></div>
            <div class="rule"><span class="rule-mark">03</span><div><p>休息日出门每两周至少 1 次</p><small>慢慢积累就很好</small></div></div>
            <div class="rule"><span class="rule-mark">04</span><div><p>微锚点每周至少 5 天，完成任意 2 个</p><small>${anchorDays} / 5 天</small></div></div>
            <div class="rule"><span class="rule-mark">05</span><div><p>连续断档不超过 3 天</p><small>断档不补，明天继续</small></div></div>
          </div>
        </section>
        <div class="notice notice-calm">${icon('leaf', 18)}<span>每月只改 1 个变量：任务难度、提醒时间、任务库分类，三选一。</span></div>
      `;
    }
