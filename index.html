                  return `
                    <label class="preset">
                      <input type="radio" name="preset" value="${name}" ${profile.preset === name ? 'checked' : ''}>
                      <strong>${name}</strong>
                      <span><span class="preset-zh">${zh}</span><span class="preset-en">${en}</span></span>
                    </label>`;
                }).join('')}
              </div>
              <label class="field" style="margin-top:18px">
                <span class="field-label">显示语言 <em>Display language</em></span>
                <select class="control" name="language">
                  <option value="zh" ${state.settings.language !== 'en' ? 'selected' : ''}>${state.settings.language === 'en' ? 'Chinese' : '中文'}</option>
                  <option value="en" ${state.settings.language === 'en' ? 'selected' : ''}>English</option>
                </select>
              </label>
              <p class="settings-note">${icon('spark', 15)} 周一至周五自动按“工作日 / 学习日”派任务，周六和周日按“休息日”派任务。</p>
            </div>
          </fieldset>
          <button class="btn btn-dark btn-wide" type="submit">${icon('check', 18)} 保存设置</button>
        </form>
        <details class="settings-advanced" style="margin-top:12px">
          <summary>
            <span>
              <span class="settings-summary-title">数据管理</span>
              <span class="settings-summary-note">导出、导入或清空本机数据</span>
            </span>
            ${icon('chevron', 18, 'chevron')}
          </summary>
          <div class="settings-advanced-content">
            <div class="data-actions">
              <button class="btn btn-secondary" data-action="export">${icon('download', 17)} 导出 JSON</button>
              <button class="btn btn-secondary" data-action="import">${icon('upload', 17)} 导入 JSON</button>
              <input class="sr-only" id="import-input" type="file" accept="application/json,.json">
              <button class="btn btn-danger" data-action="clear-data">${icon('trash', 17)} ${ui.clearArmed ? '再点一次清空数据' : '清空本机数据'}</button>
            </div>
          </div>
        </details>
        <div class="privacy-note">${icon('shield', 15)} 数据只存本机，不上传。当前共 ${state.records.length} 条记录。</div>
      `;
    }

    function settingsView() {
      return layout(settingsContent());
    }

    function moreView() {
      const isSettings = ui.moreTab === 'settings';
      return layout(`
        <div class="subnav-tabs" role="tablist" aria-label="周报与设置">
          <button class="${isSettings ? '' : 'is-active'}" data-action="switch-more" data-more-tab="weekly" role="tab" aria-selected="${!isSettings}">周报</button>
          <button class="${isSettings ? 'is-active' : ''}" data-action="switch-more" data-more-tab="settings" role="tab" aria-selected="${isSettings}">设置</button>
        </div>
        ${isSettings ? settingsContent() : weeklyContent()}
      `);
    }

    function render() {
      const app = document.getElementById('app');
      ensureToday();
      const views = {
        today: todayView,
        records: recordsView,
        collection: collectionView,
        map: mapView,
        more: moreView
      };
      app.innerHTML = (views[ui.page] || todayView)();
      applyBilingualText(app);
      applyLanguage();
      requestAnimationFrame(() => {
        const active = document.querySelector('.nav-btn.is-active');
        if (ui.page === 'today' && !document.querySelector('.overlay')) window.scrollTo({ top: 0, behavior: 'instant' });
      });
    }

    function newRecordId() {
      if (window.crypto?.randomUUID) return window.crypto.randomUUID();
      return `record-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function saveSafely(silent = false) {
      try {
        saveState();
        return true;
      } catch (error) {
        console.error('本机存储写入遇到问题', error);
        if (!silent) showToast('本机空间有些紧，这次内容可能没有完整留下。');
        return false;
      }
    }

    function compressPhoto(file) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith('image/')) {
          reject(new Error('请选择图片文件'));
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('读取照片时遇到问题'));
        reader.onload = () => {
          const image = new Image();
          image.onerror = () => reject(new Error('照片格式暂时无法读取'));
          image.onload = () => {
            const scale = Math.min(1, 800 / Math.max(image.naturalWidth, image.naturalHeight));
            const width = Math.max(1, Math.round(image.naturalWidth * scale));
            const height = Math.max(1, Math.round(image.naturalHeight * scale));
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const context = canvas.getContext('2d');
            context.fillStyle = '#fff';
            context.fillRect(0, 0, width, height);
            context.drawImage(image, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.6));
          };
          image.src = String(reader.result);
        };
        reader.readAsDataURL(file);
      });
    }

    function incrementI(taskId) {
      if (!taskId.startsWith('I')) return;
      if (state.weekI.weekKey !== getWeekKey()) state.weekI = { weekKey: getWeekKey(), count: 0 };
      state.weekI.count = Number(state.weekI.count || 0) + 1;
    }

    function regenerateForSettings() {
      if (!state.dailyAssignment || mainCompletedToday()) return;
      const assignment = state.dailyAssignment;
      const completedAnchors = (assignment.completedTaskIds || []).filter(id => !assignment.mainTaskId || id !== assignment.mainTaskId);
      assignment.extraTaskIds = assignment.extraTaskIds || [];
      assignment.skippedMainIds = assignment.skippedMainIds || [];
      const completedExtras = (assignment.completedTaskIds || []).filter(id => assignment.extraTaskIds.includes(id));
      const result = chooseMainTask();
      if (!result.picked) return;
      assignment.mainTaskId = result.picked.id;
      assignment.anchorIds = assignment.anchorIds?.length === 2 ? assignment.anchorIds : chooseAnchors().map(t => t.id);
      assignment.completedTaskIds = [
        ...completedAnchors.filter(id => assignment.anchorIds.includes(id)),
        ...completedExtras
      ];
      assignment.rerollUsed = false;
      assignment.seenMainIds = Array.from(new Set([...(assignment.seenMainIds || []), result.picked.id]));
      assignment.gapForced = result.forced;
      assignment.status = 'pending';
      incrementI(result.picked.id);
    }

    function changeDayType(dayType) {
      if (!DAY_TYPES.includes(dayType) || !state.dailyAssignment) return;
      const alreadyDone = mainCompletedToday();
      state.settings.dayType = dayType;
      state.dailyAssignment.dayType = dayType;
      if (!alreadyDone) {
        const assignment = state.dailyAssignment;
        assignment.extraTaskIds = assignment.extraTaskIds || [];
        assignment.skippedMainIds = assignment.skippedMainIds || [];
        const anchorCompletions = (assignment.completedTaskIds || []).filter(id => assignment.anchorIds.includes(id));
        const extraCompletions = (assignment.completedTaskIds || []).filter(id => assignment.extraTaskIds.includes(id));
        const result = chooseMainTask();
        if (result.picked) {
          assignment.mainTaskId = result.picked.id;
          assignment.completedTaskIds = [...anchorCompletions, ...extraCompletions];
          assignment.rerollUsed = false;
          assignment.seenMainIds = Array.from(new Set([...(assignment.seenMainIds || []), result.picked.id]));
          assignment.gapForced = result.forced;
          assignment.status = assignment.anchorIds.every(id => anchorCompletions.includes(id)) ? 'anchors-done' : 'pending';
          incrementI(result.picked.id);
        }
        showToast(`已切到${dayType}，微锚点保留。`);
      } else {
        showToast(`日类型已切换；今天的完成会原样保留。`);
      }
      syncHistoryEntry();
      saveSafely(true);
      render();
    }

    function rerollMain() {
      const assignment = state.dailyAssignment;
      if (!assignment || mainCompletedToday()) return;
      const result = chooseMainTask({ reroll: true });
      if (!result.picked) {
        showToast('今天暂时没有更合适的一张，保留现在这张也很好。');
        return;
      }
      assignment.mainTaskId = result.picked.id;
      assignment.rerollUsed = true;
      assignment.seenMainIds = Array.from(new Set([...(assignment.seenMainIds || []), result.picked.id]));
      assignment.gapForced = result.forced;
      assignment.status = (assignment.completedTaskIds || []).filter(id => assignment.anchorIds.includes(id)).length === 2 ? 'anchors-done' : 'pending';
      incrementI(result.picked.id);
      syncHistoryEntry();
      saveSafely(true);
      render();
      showToast('换了一张，两个微锚点还在。');
    }

    function skipMainTask() {
      const assignment = state.dailyAssignment;
      if (!assignment || mainCompletedToday()) return;
      const skippedId = assignment.mainTaskId;
      assignment.skippedMainIds = Array.from(new Set([...(assignment.skippedMainIds || []), skippedId]));
      rerollMain();
      showToast('这张先跳过，今天不再抽到它。');
    }

    function beginTaskReveal(taskId) {
      if (!taskId || !TASK_BY_ID[taskId] || ui.rollingTaskId) return;
      ui.rollingTaskId = taskId;
      render();
      clearTimeout(ui.rollTimer);
      const reduceMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
      ui.rollTimer = setTimeout(() => {
        if (ui.rollingTaskId !== taskId) return;
        ui.revealedTaskIds.add(taskId);
        ui.rollingTaskId = null;
        render();
        requestAnimationFrame(() => document.getElementById(`task-card-${taskId}`)?.focus({ preventScroll: true }));
      }, reduceMotion ? 80 : 760);
    }

    function addExtraTask() {
      if (!state.dailyAssignment) return;
      const picked = chooseExtraTask();
      if (!picked) {
        showToast('任务池暂时抽完了，明天再继续。');
        return;
      }
      if (!Array.isArray(state.dailyAssignment.extraTaskIds)) state.dailyAssignment.extraTaskIds = [];
      state.dailyAssignment.extraTaskIds.push(picked.id);
      saveSafely(true);
      beginTaskReveal(picked.id);
    }

    function openCompletion(taskId) {
      if (!taskId || completedIdsToday().has(taskId)) return;
      ui.completion = { taskId, quickPhrase: '', note: '', photo: '' };
      render();
      const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;
      if (!isTouchDevice) {
        requestAnimationFrame(() => document.querySelector('[data-completion-note]')?.focus());
      }
    }

    function closeCompletion() {
      document.activeElement?.blur();
      ui.completion = { taskId: null, quickPhrase: '', note: '', photo: '' };
      render();
    }

    function saveCompletion() {
      const taskId = ui.completion.taskId;
      if (!taskId || completedIdsToday().has(taskId)) return;
      const t = task(taskId);
      const recordKind = taskId === state.dailyAssignment.mainTaskId
        ? 'main'
        : state.dailyAssignment.anchorIds.includes(taskId) ? 'anchor' : 'extra';
      const record = {
        id: newRecordId(),
        date: dateKey(),
        taskId,
        kind: recordKind,
        done: true,
        quickPhrase: ui.completion.quickPhrase || '',
        note: ui.completion.note || '',
        photo: state.settings.photoEnabled ? (ui.completion.photo || '') : '',
        xp: t.xp,
        createdAt: new Date().toISOString()
      };
      state.records.unshift(record);
      if (!state.dailyAssignment.completedTaskIds) state.dailyAssignment.completedTaskIds = [];
      state.dailyAssignment.completedTaskIds.push(taskId);
      const allDone = [state.dailyAssignment.mainTaskId, ...state.dailyAssignment.anchorIds].every(id => state.dailyAssignment.completedTaskIds.includes(id));
      state.dailyAssignment.status = allDone ? 'completed' : 'in-progress';
      if (!t.isAnchor) {
        if (!state.collection.unlockedTaskIds.includes(taskId)) state.collection.unlockedTaskIds.push(taskId);
        if (!state.collection.unlockDates[taskId]) state.collection.unlockDates[taskId] = dateKey();
      }
      syncHistoryEntry();
      let photoLost = false;
      try {
        saveState();
      } catch (error) {
        console.error('保存完成记录时本机空间不足', error);
        if (record.photo) {
          record.photo = '';
          photoLost = true;
          try { saveState(); } catch (secondError) { console.error(secondError); }
        }
      }
      const needsPlace = (t.category === '出门' || t.category === '隐藏挑战') && t.completion.includes('地点类型');
      document.activeElement?.blur();
      ui.completion = { taskId: null, quickPhrase: '', note: '', photo: '' };
      ui.locationTaskId = needsPlace ? taskId : null;
      render();
      showToast(photoLost ? '照片未保存，仅保存完成状态。' : `${escapeHTML(t.name)} 已收进今天。+${t.xp} XP`);
    }

    function choosePlace(place) {
      if (!PLACES.includes(place)) return;
      if (!state.map) state.map = { litPlaceTypes: {} };
      if (!state.map.litPlaceTypes) state.map.litPlaceTypes = {};
      state.map.litPlaceTypes[place] = Number(state.map.litPlaceTypes[place] || 0) + 1;
      ui.locationTaskId = null;
      saveSafely(true);
      render();
      showToast(`${place} 亮了一格。位置本身不会保存。`);
    }

    function saveSettings(form) {
      const formData = new FormData(form);
      const presetName = String(formData.get('preset') || state.profile.preset || '独处恢复型');
      const preset = PRESETS[presetName] || PRESETS['独处恢复型'];
      state.profile = {
        ...state.profile,
        ...preset,
        createdDate: state.profile.createdDate || dateKey(),
        rhythmSelected: true
      };
      const selectedLanguage = String(formData.get('language') || state.settings.language);
      state.settings.language = selectedLanguage === 'en' ? 'en' : 'zh';
      regenerateForSettings();
      syncHistoryEntry();
      saveSafely(true);
      render();
      showToast('设置已保存；之后的任务会按新节奏来。');
    }

    function exportData() {
      try {
        const payload = JSON.stringify({ ...state, tasks: TASKS }, null, 2);
        const blob = new Blob([payload], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `i人小副本-数据-${dateKey()}.json`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1200);
        showToast('JSON 已导出。');
      } catch (error) {
        console.error(error);
        showToast('导出时遇到一点问题，请稍后再试。');
      }
    }

    function normalizeImportedState(data) {
      if (!data || typeof data !== 'object' || !data.profile) throw new Error('JSON 结构不完整');
      const base = createInitialState();
      return {
        ...base,
        ...data,
        initialized: true,
        profile: normalizeProfile(data.profile),
        settings: {
          ...base.settings,
          ...(data.settings || {}),
          language: data.settings?.language === 'en' ? 'en' : 'zh'
        },
        tasks: TASKS,
        dailyAssignment: data.dailyAssignment || null,
        history: data.history || {},
        records: Array.isArray(data.records) ? data.records : [],
        collection: {
          unlockedTaskIds: Array.isArray(data.collection?.unlockedTaskIds) ? data.collection.unlockedTaskIds.filter(id => TASK_BY_ID[id]) : [],
          unlockDates: data.collection?.unlockDates || {}
        },
        map: {
          litPlaceTypes: {
            ...Object.fromEntries(PLACES.map(p => [p, 0])),
            ...(data.map?.litPlaceTypes || {})
          }
        },
        weekI: { weekKey: getWeekKey(), count: 0, ...(data.weekI || {}) }
      };
    }

    async function importData(file) {
      if (!file) return;
      try {
        const text = await file.text();
        const imported = normalizeImportedState(JSON.parse(text));
        state = imported;
        ensureToday();
        saveState();
        ui.page = 'today';
        ui.clearArmed = false;
        render();
        showToast('JSON 已导入，本机数据已更新。');
      } catch (error) {
        console.error(error);
        showToast('这份 JSON 暂时无法读取，请选择本应用导出的文件。');
      }
    }

    function handleClearData() {
      if (!ui.clearArmed) {
        ui.clearArmed = true;
        render();
        showToast('再点一次就会清空本机记录与设置。');
        setTimeout(() => {
          if (ui.clearArmed) {
            ui.clearArmed = false;
            if (state.initialized) render();
          }
        }, 4200);
        return;
      }
      try { localStorage.removeItem(STORAGE_KEY); } catch (error) { console.error(error); }
      state = createInitialState();
      ui.page = 'today';
      ui.revealedTaskIds.clear();
      ui.calendarMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
      ui.selectedRecordDate = dateKey();
      clearTimeout(ui.rollTimer);
      ui.rollingTaskId = null;
      ui.completion = { taskId: null, quickPhrase: '', note: '', photo: '' };
      ui.locationTaskId = null;
      ui.clearArmed = false;
      render();
      showToast('本机数据已清空，可以从轻一点的地方重新开始。');
    }

    document.addEventListener('click', event => {
      const actionElement = event.target.closest('[data-action]');
      if (!actionElement) return;
      if (actionElement.classList.contains('overlay') && event.target.closest('[data-stop-close]')) return;
      const action = actionElement.dataset.action;

      if (action === 'navigate') {
        clearTimeout(ui.rollTimer);
        ui.rollingTaskId = null;
        ui.page = actionElement.dataset.page;
        ui.clearArmed = false;
        render();
        return;
      }
      if (action === 'switch-more') {
        const tab = actionElement.dataset.moreTab;
        if (tab === 'weekly' || tab === 'settings') {
          ui.moreTab = tab;
          ui.page = 'more';
          ui.clearArmed = false;
          render();
          window.scrollTo({ top: 0, behavior: 'instant' });
        }
        return;
      }
      if (action === 'calendar-prev' || action === 'calendar-next') {
        const direction = action === 'calendar-prev' ? -1 : 1;
        const nextMonth = new Date(ui.calendarMonth.getFullYear(), ui.calendarMonth.getMonth() + direction, 1);
        const preferredDay = parseDateKey(ui.selectedRecordDate).getDate();
        const lastDay = new Date(nextMonth.getFullYear(), nextMonth.getMonth() + 1, 0).getDate();
        ui.calendarMonth = nextMonth;
        ui.selectedRecordDate = dateKey(new Date(nextMonth.getFullYear(), nextMonth.getMonth(), Math.min(preferredDay, lastDay)));
        render();
        return;
      }
      if (action === 'calendar-today') {
        ui.calendarMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
        ui.selectedRecordDate = dateKey();
        render();
        return;
      }
      if (action === 'select-record-date') {
        const selected = actionElement.dataset.date;
        if (selected) {
          const parsed = parseDateKey(selected);
          ui.selectedRecordDate = selected;
          ui.calendarMonth = new Date(parsed.getFullYear(), parsed.getMonth(), 1);
          render();
        }
        return;
      }
      if (action === 'toggle-low-day') {
        const nextType = state.dailyAssignment?.dayType === '低电量日' ? defaultDayType() : '低电量日';
        changeDayType(nextType);
        return;
      }
      if (action === 'change-day') {
        changeDayType(actionElement.dataset.day);
        return;
      }
      if (action === 'reroll') {
        rerollMain();
        return;
      }
      if (action === 'skip-main') {
        skipMainTask();
        return;
      }
      if (action === 'reveal-task') {
        const taskId = actionElement.dataset.taskId;
        beginTaskReveal(taskId);
        return;
      }
      if (action === 'add-extra') {
        addExtraTask();
        return;
      }
      if (action === 'open-complete') {
        openCompletion(actionElement.dataset.taskId);
        return;
      }
      if (action === 'close-sheet') {
        closeCompletion();
        return;
      }
      if (action === 'quick-phrase') {
        ui.completion.quickPhrase = actionElement.dataset.phrase;
        render();
        return;
      }
      if (action === 'choose-place') {
        choosePlace(actionElement.dataset.place);
        return;
      }
      if (action === 'skip-place') {
        ui.locationTaskId = null;
        render();
        showToast('这次只留下完成记录。');
        return;
      }
      if (action === 'export') {
        exportData();
        return;
      }
      if (action === 'import') {
        document.getElementById('import-input')?.click();
        return;
      }
      if (action === 'clear-data') {
        handleClearData();
      }
    });

    document.addEventListener('change', event => {
      const target = event.target;
      if (target.matches('[data-form="settings"] select[name="language"]')) {
        state.settings.language = target.value === 'en' ? 'en' : 'zh';
        saveSafely(true);
        render();
        return;
      }
      if (target.matches('[data-form="settings"] input[name="preset"]')) {
        const preset = PRESETS[target.value];
        if (preset) {
          state.profile = { ...state.profile, ...preset, mbti: state.profile.mbti || '', rhythmSelected: true };
          render();
          showToast('已套用预设，记得点保存设置。');
        }
        return;
      }
      if (target.matches('[data-photo-input]')) {
        const file = target.files?.[0];
        if (!file) return;
        compressPhoto(file).then(photo => {
          ui.completion.photo = photo;
          render();
          showToast('照片已压缩到本机记录大小。');
        }).catch(error => {
          console.error(error);
          showToast('这张照片暂时无法读取，可以跳过照片继续保存。');
        });
        return;
      }
      if (target.matches('#import-input')) {
        importData(target.files?.[0]);
      }
    });

    document.addEventListener('input', event => {
      if (event.target.matches('[data-completion-note]')) {
        ui.completion.note = event.target.value;
      }
    });

    document.addEventListener('submit', event => {
      event.preventDefault();
      if (event.target.matches('[data-form="completion"]')) saveCompletion();
      if (event.target.matches('[data-form="settings"]')) saveSettings(event.target);
    });

    document.getElementById('app-icon').href = SHARK_ICON;
    document.getElementById('app-touch-icon').href = SHARK_ICON;
    state = loadState();
    applyLanguage();
    try { saveState(); } catch (error) { console.error(error); }
    ensureToday();
    render();
  })();
  </script>
</body>
</html>
